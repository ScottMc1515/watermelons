*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#dfe6d3;color:var(--ink)}body{overflow:hidden}.app-shell{height:100dvh;max-width:560px;margin:auto;position:relative;background:#edf1df;overflow:hidden}.topbar{height:82px;padding:14px 18px 8px;display:flex;justify-content:space-between;align-items:center;background:rgba(248,249,235,.88);backdrop-filter:blur(14px);position:relative;z-index:5;border-bottom:1px solid var(--line)}.eyebrow{font-size:9px;letter-spacing:.16em;font-weight:800;color:var(--sage-dark)}h1{font:700 25px Georgia,serif;margin:2px 0 0}.icon-btn,.close-btn{border:0;background:rgba(67,85,62,.08);width:40px;height:40px;border-radius:50%;font-size:19px;color:var(--ink);cursor:pointer}.feed{height:calc(100dvh - 82px - 72px);overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}.feed::-webkit-scrollbar{display:none}.card{min-height:100%;scroll-snap-align:start;position:relative;padding:26px 20px 28px;display:flex;align-items:flex-end;background:#60705c;isolation:isolate}.card:before{content:"";position:absolute;inset:0;z-index:-2;background:var(--bg);background-size:cover;background-position:center}.card:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(18,27,18,.06),rgba(18,27,18,.08) 28%,rgba(18,27,18,.82) 100%)}.card[data-theme="psychology"]{--bg:radial-gradient(circle at 22% 20%,#d6e6e8 0,#92b3b5 25%,#516d68 55%,#243a35 100%)}.card[data-theme="philosophy"]{--bg:linear-gradient(135deg,#c6aa7c,#e1cfaa 43%,#718269 70%,#3b4e3c)}.card[data-theme="mythology"]{--bg:linear-gradient(135deg,#d6a26b,#8c6c4a 43%,#536d52 68%,#263d30)}.card[data-theme="faith"]{--bg:linear-gradient(135deg,#f0d28b,#ad9d69 36%,#67825f 66%,#304a37)}.card[data-theme="fitness"]{--bg:linear-gradient(135deg,#b7a580,#71856b 44%,#3f5845 68%,#1e3229)}.card[data-theme="history"]{--bg:linear-gradient(135deg,#e0c08d,#a08460 42%,#66654c -options button.wrong{outline:2px solid #a65c4d;background:#f8e9e4}.quiz-result{font-size:12px!important;font-weight:700;margin-top:10px!important}.quiz-result.good{color:#4e7444}.quiz-result.bad{color:#9a5144}.bottom-nav{height:72px;position:absolute;bottom:0;left:0;right:0;background:rgba(248,249,235,.94);backdrop-filter:blur(16px);display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);z-index:10}.nav-btn{border:0;background:none;color:#71806e;font-weight:700;font-size:19px;cursor:pointer}.nav-btn span{display:block;font-size:10px;margin-top:2px}.nav-btn.active{color:var(--sage-dark)}.sheet{position:fixed;inset:0;z-index:50}.sheet.hidden{display:none}.sheet-backdrop{position:absolute;inset:0;background:rgba(22,29,22,.42);backdrop-filter:blur(4px)}.sheet-card{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);max-height:90dvh;overflow:auto;background:var(--cream);border-radius:28px 28px 0 0;padding:28px 22px 36px;box-shadow:0 -20px 60px rgba(0,0,0,.2)}.close-btn{position:absolute;right:18px;top:16px}.sheet-card h2{font:700 30px Georgia,serif;margin:0 40px 10px 0}.sheet-card h3{font:700 16px Georgia,serif;margin:22px 0 10px}.sheet-card p{line-height:1.5;color:var(--muted)}.sheet-kicker{font-size:10px;letter-spacing:.13em;font-weight:900;color:var(--sage-dark);margin-bottom:7px}.topic-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.topic{border:1px solid var(--line);border-radius:18px;padding:14px;background:#f3eedf;text-align:left;cursor:pointer;color:var(--ink)}.topic.selected{background:#dfe9d4;border-color:#738965;box-shadow:inset 0 0 0 1px #738965}.topic strong{display:block;margin-top:6px}.topic small{display:block;color:var(--muted);line-height:1.3;margin-top:4px}.segmented{display:flex;gap:7px}.segmented button{flex:1;border:1px solid var(--line);background:#f3eedf;padding:11px;border-radius:13px;font-weight:800;color:var(--ink)}.segmented button.selected{background:var(--sage-dark);color:#fff}.range-label{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11px}.range-label input{flex:1;accent-color:var(--sage-dark)}.cta{display:block;width:100%;background:var(--sage-dark);padding:13px;margin-top:14px;font-size:14px}.danger-btn{border:0;background:transparent;color:#9a5144;font-weight:800;padding:16px 0;cursor:pointer}.request-box{background:#f3eedf;border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:18px}.request-box h3{margin-top:0}.request{display:flex;gap:8px;margin-top:12px}.request input{flex:1;border:1px solid var(--line);border-radius:14px;padding:13px;background:white;font:inherit;min-width:0}.request button{border:0;border-radius:14px;padding:0 15px;background:var(--sage-dark);color:white;font-weight:800}.trail{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:18px 0}.trail span{background:#f1ead8;border:1px solid var(--line);padding:8px 10px;border-radius:999px;font-size:12px;font-weight:700}.trail b{color:var(--muted)}.mini-list{display:grid;gap:7px}.mini-list button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#f3eedf;border-radius:15px;padding:10px;text-align:left}.mini-list button span{font-size:20px}.mini-list button div{flex:1}.mini-list strong,.mini-list small{display:block}.mini-list small{color:var(--muted);margin-top:2px}.mini-list b{font-size:20px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f0ebdc;border-radius:18px;padding:16px;text-align:center}.stat b{display:block;font:700 25px Georgia,serif}.stat span{font-size:11px;color:var(--muted)}.journey-paper{margin-top:14px}.big-number{font:700 34px Georgia,serif!important;color:var(--ink)!important;margin:0!important}.shelf-chip{display:inline-block;background:#f0ead9;border:1px solid var(--line);border-radius:999px;padding:7px 9px;margin:3px;font-size:11px;font-weight:700}.welcome{text-align:center;padding-top:8px}.mel <script>
const TOPICS = [
  {id:'psychology',name:'Psychology',icon:'🧠',tone:'mind',desc:'Mind, behavior, cognition, and people.'},
  {id:'philosophy',name:'Philosophy',icon:'🏛️',tone:'marble',desc:'Ideas about truth, meaning, ethics, and living well.'},
  {id:'mythology',name:'Greek Mythology',icon:'⚔️',tone:'olive',desc:'Gods, heroes, monsters, and ancient stories.'},
  {id:'faith',name:'Christian Faith',icon:'✝️',tone:'sunrise',desc:'Scripture, theology, history, and thoughtful questions.'},
  {id:'fitness',name:'Lifting & Nutrition',icon:'🏋️',tone:'forest',desc:'Training, muscle, nutrition, recovery, and performance.'},
  {id:'history',name:'History',icon:'📜',tone:'parchment',desc:'Civilizations, people, events, and forgotten details.'},
  {id:'science',name:'Science',icon:'🔭',tone:'cosmos',desc:'The universe, life, matter, and how we know things.'},
  {id:'literature',name:'Literature',icon:'📚',tone:'library',desc:'Books, stories, authors, themes, and language.'}
];

const BANK = [
  {theme:'psychology',type:'concept',tag:'Psychology · Cognition',title:'The Spacing Effect',dek:'Memory often benefits when learning is spread out instead of crammed together.',body:'Spacing creates repeated retrieval opportunities across time. A little forgetting between study sessions can make later retrieval more effortful, and that effort can strengthen learning.'},
  {theme:'psychology',type:'concept',tag:'Psychology · Attention',title:'Change Blindness',dek:'Sometimes a surprisingly large visual change can slip past attention.',body:'When attention is occupied or visual information is interrupted, people can miss changes they would easily notice if they were looking specifically for them. Attention is selective, not a perfect recording device.'},
  {theme:'psychology',type:'concept',tag:'Psychology · Memory',title:'The Testing Effect',dek:'Trying to remember can teach you more than rereading the answer.',body:'Retrieval practice can strengthen later recall. A short quiz before looking at an explanation turns passive exposure into an active memory event.'},
  {theme:'psychology',type:'concept',tag:'Psychology · Learning',title:'Desirable Difficulty',dek:'Some kinds of difficulty during practice can improve later retention.',body:'Interleaving, spacing, and retrieval can feel harder than rereading, yet that difficulty can produce stronger long-term learning. The trick is useful challenge, not needless frustration.'},
  {theme:'philosophy',type:'quote',tag:'Philosophy · Aristotle',title:'A Life of Practice',quote:'“We are what we repeatedly do.”',byline:'A concise modern formulation associated with an idea in Aristotle’s Nicomachean Ethics.',body:'Aristotle’s broader account of virtue emphasizes habituation: character develops through repeated choices and practices, not merely through knowing what is good.'},
  {theme:'philosophy',type:'concept',tag:'Philosophy · Stoicism',title:'What Is in Your Control?',dek:'A central Stoic move is to separate your judgments and actions from events outside your command.',body:'Epictetus repeatedly distinguishes what depends on us from what does not. The point is not passive resignation. It is to focus effort where agency actually exists.'},
  {theme:'philosophy',type:'concept',tag:'Philosophy · Existentialism',title:'Meaning Is a Question',dek:'Existentialist thinkers often treat meaning as something we have to confront rather than simply receive.',body:'Different existentialists disagree sharply about God, freedom, and meaning. What connects many of them is sustained attention to choice, responsibility, mortality, and the problem of how to live.'},
  {theme:'mythology',type:'myth',tag:'Greek Mythology · Athena',title:'Why Athena Has an Unusual Birth',dek:'Athena’s birth from Zeus’s head is more than an odd family story.',body:'In a famous mythic tradition, Zeus swallows Metis and later suffers a terrible headache. Hephaestus opens Zeus’s head, and Athena emerges armed. The story links Athena with wisdom, strategy, and Zeus’s sovereignty.'},
  {theme:'mythology',type:'myth',tag:'Greek Mythology · Odysseus',title:'Why Odysseus Needed the Mast',dek:'The Sirens story is an experiment in planning around your future self.',body:'Odysseus wants to hear the Sirens without steering the ship toward danger. He orders his crew to plug their ears, bind him to the mast, and obey his earlier instructions even if he later begs to be released.'},
  {theme:'mythology',type:'myth',tag:'Greek Mythology · Sisyphus',title:'The Boulder Keeps Coming Back',dek:'Sisyphus became one of mythology’s clearest images of endless labor.',body:'Sisyphus is condemned to push a boulder uphill only to watch it roll back down. Later philosophical interpretations, especially Camus’s, use the myth to ask what it means to live under conditions that do not supply an obvious final resolution.'},
  {theme:'faith',type:'faith',tag:'Christian Faith · Romans',title:'Renewing Your Mind',dek:'Romans 12:2 connects transformed thinking with transformed living.',body:'Paul places the famous phrase inside a larger appeal to embodied, communal Christian life. The passage is not simply a command to collect more information. It concerns discernment, changed patterns, and a life oriented toward what is good.'},
  {theme:'faith',type:'faith',tag:'Christian Faith · Gospel',title:'What Does “Gospel” Mean?',dek:'The word “gospel” originally carried the sense of good news.',body:'In the New Testament, gospel refers to the proclaimed good news about Jesus. It is not merely a genre of four books. Matthew, Mark, Luke, and John are later called Gospels because they present narratives centered on that proclamation.'},
  {theme:'faith',type:'faith',tag:'Christian Faith · Early Church',title:'Why the Early Church Memorized So Much',dek:'Before every believer could carry a printed Bible in a pocket, memory mattered.',body:'Early Christian communities relied heavily on oral teaching, repeated readings, hymns, prayers, and communal practices. Memorization was not just an academic exercise. It helped preserve teaching across communities and generations.'},
  {theme:'fitness',type:'concept',tag:'Lifting & Nutrition · Hypertrophy',title:'Mechanical Tension',dek:'Muscle growth is strongly related to the tension experienced by muscle fibers during resistance training.',body:'Hard sets that challenge the target muscle provide a stimulus for adaptation. Exercise selection, load, range of motion, proximity to failure, volume, and recovery all influence how useful that stimulus becomes.'},
  {theme:'fitness',type:'concept',tag:'Lifting & Nutrition · Recovery',title:'Muscle Is Built Between Sessions',dek:'Training provides the stimulus. Recovery gives the body room to adapt.',body:'Sleep, sufficient energy, protein, and time between hard sessions all matter. More training is not automatically more growth if fatigue keeps accumulating faster than adaptation.'},
  {theme:'fitness',type:'concept',tag:'Lifting & Nutrition · Nutrition',title:'Protein Distribution',dek:'Total daily protein matters, but spreading intake across the day can make a practical diet easier to manage.',body:'A protein-rich meal or snack at several points in the day gives you repeated opportunities to supply amino acids. You do not need a perfectly timed anabolic clock. Consistency is the useful part.'},
  {theme:'history',type:'concept',tag:'History · Rome',title:'Roman Concrete Had a Strange Advantage',dek:'Some Roman concrete structures have survived for centuries in harsh environments.',body:'Roman concrete used volcanic materials in mixtures that could behave differently from modern Portland cement. Researchers continue to study why some ancient structures, especially marine ones, remain remarkably durable.'},
  {theme:'history',type:'concept',tag:'History · Writing',title:'Books Used to Be Hand-Made Objects',dek:'For much of history, a book meant someone had to make it page by page.',body:'Before industrial printing, producing a manuscript could require prepared animal skin or paper, ink, scribes, binding, and enormous amounts of labor. A library represented a substantial investment of time and material.'},
  {theme:'science',type:'concept',tag:'Science · Astronomy',title:'A Light-Year Is a Distance',dek:'Despite its name, a light-year measures how far light travels in a year.',body:'Light moves through vacuum at about 299,792 kilometers per second. Multiply that enormous speed by a year and you get a distance of roughly 9.46 trillion kilometers.'},
  {theme:'science',type:'concept',tag:'Science · Biology',title:'Your Cells Have Tiny Recycling Systems',dek:'Cells continually break down and reuse components.',body:'Processes such as autophagy help cells deliver damaged or unnecessary components for breakdown and recycling. It is part of ordinary cellular maintenance, not a mysterious detox switch.'},
  {theme:'literature',type:'concept',tag:'Literature · Reading',title:'An Unreliable Narrator Changes the Game',dek:'A narrator can tell a story without giving you a perfectly trustworthy account of it.',body:'When a narrator is unreliable, readers have to compare what is said with what the story itself reveals. The technique can create suspense, irony, comedy, or a gradual shift in how we understand the characters.'},
  {theme:'literature',type:'concept',tag:'Literature · Myth',title:'Stories Travel by Changing',dek:'A story can survive precisely because later cultures reshape it.',body:'Myths and literary traditions are often retold rather than preserved as a single fixed text. Comparing versions can reveal what different communities valued, feared, or wanted the story to mean.'}
];

const QUIZZES = [

 {theme:'philosophy',tag:'Philosophy · Quick Check',title:'Stoic Control',dek:'Which situation most closely fits the Stoic distinction about control?',options:['Controlling exactly what another person thinks','Choosing your response to an insult','Guaranteeing tomorrow’s weather','Making everyone like your work'],answer:1,explain:'The Stoic focus is on what depends on you, such as your judgments and responses, rather than outcomes controlled by other people or events.'},
 {theme:'mythology',tag:'Greek Mythology · Quick Check',title:'The Sirens',dek:'Why did Odysseus have himself bound to the mast?',options:['To escape Scylla','To hear the Sirens without steering toward them','To stop his crew mutinying','To honor Poseidon'],answer:1,explain:'Odysseus wanted to hear the Sirens while preventing himself from acting on their song.'},

];

const DEFAULT_PREFS = {topics:TOPICS.map(t=>t.id),difficulty:'curious',novelty:35,shuffle:true};
const state = {
 prefs: load('watermelons-prefs', DEFAULT_PREFS),
 saved: load('watermelons-saved', []),
 seen: load('watermelons-seen', 0),
 correct: load('watermelons-correct', 0),
 attempted: load('watermelons-attempted', 0),
 skipped: load('watermelons-skipped', 0),
 streak: load('watermelons-streak', {count:0,last:null}),
 generated: load('watermelons-generated', []),
 tab:'feed',
 cursor:0,
 onboarding: localStorage.getItem('watermelons-onboarded') === '1'
};

const feed = document.getElementById('feed');
let deferredInstall = null;

function load(key, fallback){try{const x=JSON.parse(localStorage.getItem(key));return x ?? fallback}catch{return fallback}}
function save(key,value){localStorage.setItem(key,JSON.stringify(value))}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function topic(id){return TOPICS.find(t=>t.id===id)||TOPICS[0]}
function selectedTopics(){return state.prefs.topics.length?state.prefs.topics:TOPICS.map(t=>t.id)}
function pool(){
  const ids=new Set(selectedTopics());
  const base=BANK.filter(x=>ids.has(x.theme));
  const quizzes=QUIZZES.filter(x=>ids.has(x.theme)).map(q=>({...q,type:'quiz',id:'quiz-'+q.theme+'-'+Math.random().toString(36).slice(2,7)}));
  return [...base,...state.generated,...quizzes];
}
function makeId(item){return item.id || (item.theme+'-'+item.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,40))}
function uniqueItems(items){
  const seenIds=new Set();
  return items.filter(x=>{x.id=makeId(x); if(seenIds.has(x.id))return false; seenIds.add(x.id); return true;});
}
function nextBatch(n=8){
  let items=uniqueItems(pool());
  if(state.prefs.shuffle) items.sort(()=>Math.random()-.5);
  const out=[];
  while(out.length<n){
    if(items.length){out.push(items.shift());}
    else {generateLocal(12); items=uniqueItems(pool()).filter(x=>!out.some(y=>y.id===x.id));}
  }
  return out;
}
function generateLocal(n=12, request=''){
  const words=request.toLowerCase();
  let relevant= BANK.filter(x=>!request || x.title.toLowerCase().includes(words)||x.body?.toLowerCase().includes(words)||x.dek?.toLowerCase().includes(words));
  if(!relevant.length) relevant=BANK.filter(x=>selectedTopics().includes(x.theme));
  if(!relevant.length) relevant=BANK;
  const made=[];
  for(let i=0;i<n;i++){
    const src=relevant[(state.cursor+i)%relevant.length];
    const variants=[
      {dek:'A small question worth carrying with you: '+src.title+'.',body:src.body||src.quote||src.dek,type:'reflection'},
      {dek:'Look at this idea from another angle.',body:(src.body||src.dek)+' What changes if you connect it to something you already know?',type:'connection'},
      {dek:'Try to explain this without looking back.',body:src.body||src.dek,type:'recall'}
    ];
    const v=variants[(state.cursor+i)%variants.length];
    made.push({...src,...v,id:'gen-'+Date.now()+'-'+i+'-'+Math.random().toString(36).slice(2,7),tag:src.tag+' · Wander'});
  }
  state.generated=[...state.generated,...made].slice(-120);
  state.cursor+=n;
  save('watermelons-generated',state.generated);
  return made;
}

function renderFeed(items=nextBatch(8), append=false){
  if(!append) feed.innerHTML='';
  items.forEach(item=>feed.appendChild(card(item)));
  observeCards();
}
function card(item){
  const el=document.createElement('article');
  el.className='card'; el.dataset.theme=item.theme; el.dataset.id=item.id;
  const saved=state.saved.includes(item.id);
  let inner=`<div class="content"><div class="card-top"><span class="pill">${esc(item.tag)}</span><span class="topic-dot">${topic(item.theme).icon}</span></div><h2>${esc(item.title)}</h2><p class="dek">${esc(item.dek||'')}</p>`;
  if(item.type==='quote') inner+=`<div class="paper"><p class="quote">${esc(item.quote)}</p><p class="byline">${esc(item.byline||'')}</p>${item.body?`<p>${esc(item.body)}</p>`:''}</div>`;
  else if(item.type==='quiz') inner+=`<div class="paper"><div class="quiz-options">${item.options.map((x,i)=>`<button data-q="${i}">${String.fromCharCode(65+i)} · ${esc(x)}</button>`).join('')}</div><p id="result-${item.id}" class="quiz-result"></p></div>`;
  else inner+=`<div class="paper"><p>${esc(item.body||'')}</p></div>`;
  inner+=`<div class="actions"><button class="save ${saved?'saved':''}" data-save="${esc(item.id)}">${saved?'★ Saved':'☆ Save'}</button><button data-more="${esc(item.theme)}">More like this</button><button data-share="${esc(item.id)}">Share</button></div><div class="sub-actions"><button data-not="${esc(item.id)}">Not for me</button><button class="grow" data-related="${esc(item.id)}">Explore this idea →</button></div></div>`;
  el.innerHTML=inner;
  el.querySelector('[data-save]').onclick=()=>toggleSave(item.id,el);
  el.querySelector('[data-more]').onclick=()=>showMore(item.theme);
  el.querySelector('[data-related]').onclick=()=>openExplore(item);
  el.querySelector('[data-share]').onclick=()=>shareItem(item);
  el.querySelector('[data-not]').onclick=()=>{state.skipped++;save('watermelons-skipped',state.skipped);el.remove();};
  el.querySelectorAll('[data-q]').forEach(btn=>btn.onclick=()=>answerQuiz(item,el,Number(btn.dataset.q)));
  return el;
}
function answerQuiz(item,el,choice){
  const buttons=[...el.querySelectorAll('[data-q]')]; buttons.forEach(b=>b.disabled=true);
  const ok=choice===item.answer; buttons[choice].classList.add(ok?'correct':'wrong'); if(!ok)buttons[item.answer].classList.add('correct');
  state.attempted++; if(ok)state.correct++; save('watermelons-attempted',state.attempted);save('watermelons-correct',state.correct);
  const r=el.querySelector('.quiz-result');r.textContent=ok?'Correct. '+item.explain:'Not quite. '+item.explain;r.className='quiz-result '+(ok?'good':'bad');
}
function toggleSave(id,el){
  state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];save('watermelons-saved',state.saved);
  const b=el.querySelector('[data-save]');const yes=state.saved.includes(id);b.classList.toggle('saved',yes);b.textContent=yes?'★ Saved':'☆ Save';
}
function showMore(theme){state.prefs.topics=[theme,...state.prefs.topics.filter(x=>x!==theme)];save('watermelons-prefs',state.prefs);renderFeed(BANK.filter(x=>x.theme===theme).concat(generateLocal(8)).slice(0,10));feed.scrollTo({top:0,behavior:'smooth'});}
function openExplore(item){
  const t=topic(item.theme);
  const related=BANK.filter(x=>x.theme===item.theme&&x.id!==item.id).slice(0,4);
  showSheet(`<div class="sheet-kicker">${t.icon} ${esc(t.name)}</div><h2 id="sheetTitle">${esc(item.title)}</h2><p>Turn this into a little intellectual trail. Watermelons can move from the idea to related concepts, a question, a connection, and a deeper source.</p><div class="trail"><span>${esc(item.title)}</span><b>→</b><span>Related idea</span><b>→</b><span>Question</span><b>→</b><span>Deeper dive</span></div><button class="cta" id="rabbitBtn">Grow this rabbit hole</button><h3>Nearby ideas</h3><div class="mini-list">${related.map(x=>`<button data-open="${x.id}"><span>${topic(x.theme).icon}</span><div><strong>${esc(x.title)}</strong><small>${esc(x.tag)}</small></div><b>›</b></button>`).join('')}</div>`);
  document.getElementById('rabbitBtn').onclick=()=>{const fresh=generateLocal(8,item.title);showSheet(`<div class="sheet-kicker">🌱 Rabbit hole grown</div><h2 id="sheetTitle">${esc(item.title)}</h2><p>Eight new stepping stones were added to your private learning pool.</p><div class="paper"><p><b>Next up</b></p>${fresh.slice(0,4).map(x=>`<p>• ${esc(x.title)}</p>`).join('')}</div><button class="cta" id="wanderBtn">Wander there →</button>`);document.getElementById('wanderBtn').onclick=()=>{closeSheet();renderFeed(fresh);}};
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const x=[...BANK,...state.generated].find(y=>y.id===b.dataset.open);if(x)openExplore(x)});
}
async function shareItem(item){
  const text=`${item.title}\n\n${item.dek||item.body||''}\n\nFrom Watermelons 🍉`;
  if(navigator.share){try{await navigator.share({title:item.title,text});return}catch{}}
  try{await navigator.clipboard.writeText(text);toast('Copied to clipboard');}catch{toast('Sharing is not available here yet.')}}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}

function showSheet(html){document.getElementById('sheetContent').innerHTML=html;document.getElementById('sheet').classList.remove('hidden');document.getElementById('sheet').setAttribute('aria-hidden','false')}
function closeSheet(){document.getElementById('sheet').classList.add('hidden');document.getElementById('sheet').setAttribute('aria-hidden','true')}

function settingsSheet(){
 showSheet(`<div class="sheet-kicker">⚙︎ Personal garden</div><h2 id="sheetTitle">Tune your Watermelons</h2><p>Your choices stay on this device. The feed uses them to decide what to surface next.</p><h3>Interests</h3><div class="topic-grid">${TOPICS.map(t=>`<button class="topic ${state.prefs.topics.includes(t.id)?'selected':''}" data-pref-topic="${t.id}"><span>${t.icon}</span><strong>${t.name}</strong><small>${t.desc}</small></button>`).join('')}</div><h3>Difficulty</h3><div class="segmented">${['gentle','curious','deep'].map(x=>`<button class="${state.prefs.difficulty===x?'selected':''}" data-diff="${x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div><h3>Novelty</h3><label class="range-label"><span>Familiar</span><input id="novelty" type="range" min="0" max="100" value="${state.prefs.novelty}"><span>Surprise me</span></label><button class="cta" id="surpriseBtn">🍉 Give me something unexpected</button><button class="danger-btn" id="resetBtn">Reset my local Watermelons data</button>`);
 document.querySelectorAll('[data-pref-topic]').forEach(b=>b.onclick=()=>{const id=b.dataset.prefTopic;if(state.prefs.topics.includes(id)){if(state.prefs.topics.length>1)state.prefs.topics=state.prefs.topics.filter(x=>x!==id)}else state.prefs.topics.push(id);save('watermelons-prefs',state.prefs);settingsSheet();});
 document.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{state.prefs.difficulty=b.dataset.diff;save('watermelons-prefs',state.prefs);settingsSheet();});

 document.getElementById('resetBtn').onclick=()=>{if(confirm('Reset saved items, progress, and preferences on this device?')){localStorage.clear();location.reload();}};

document.querySelectorAll('.nav-btn').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');state.tab=btn.dataset.tab;renderTab()});
function renderTab(){
 if(state.tab==='feed'){renderFeed(nextBatch(8));return}
 if(state.tab==='saved'){const items=uniqueItems([...BANK,...state.generated]).filter(x=>state.saved.includes(x.id));renderFeed(items.length?items:[{id:'empty',theme:'literature',tag:'Saved Garden',title:'Your saved ideas will live here',dek:'When something makes you stop scrolling, save it.',body:'Try the ☆ Save button on any card. Your collection stays on this device.',type:'text'}]);return}
 if(state.tab==='explore'){showExplore();return}

function showExplore(){
 showSheet(`<div class="sheet-kicker">✦ Wander</div><h2 id="sheetTitle">Choose a world</h2><p>Pick a subject, then let curiosity decide where you go next.</p><div class="topic-grid">${TOPICS.map(t=>`<button class="topic" data-explore-topic="${t.id}"><span>${t.icon}</span><strong>${t.name}</strong><small>${t.desc}</small></button>`).join('')}</div><div class="request-box"><h3>Ask for something specific</h3><p class="small">Try “Stoicism and anger”, “obscure Greek myths”, or “how muscle protein synthesis works”.</p><div class="request"><input id="topicInput" placeholder="What do you want to learn?"><button id="requestBtn">Grow</button></div></div>`);
 document.querySelectorAll('[data-explore-topic]').forEach(b=>b.onclick=()=>{const id=b.dataset.exploreTopic;closeSheet();state.prefs.topics=[id,...state.prefs.topics.filter(x=>x!==id)];save('watermelons-prefs',state.prefs);renderFeed(nextBatch(10));});
 document.getElementById('requestBtn').onclick=()=>{const q=document.getElementById('topicInput').value.trim();if(!q)return;const fresh=generateLocal(10,q);closeSheet();renderFeed(fresh);toast('Your requested trail is growing');};

function showJourney(){
 const pct=state.attempted?Math.round(state.correct/state.attempted*100):0;

 document.getElementById('journeyWander').onclick=()=>{closeSheet();state.tab='feed';document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab==='feed'));renderFeed(nextBatch(8));};
}

function observeCards(){
 if(!('IntersectionObserver' in window))return;
 const obs=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>.65){markSeen(e.target);}}),{threshold:.65});
 document.querySelectorAll('.card:not([data-observed])').forEach(c=>{c.dataset.observed='1';obs.observe(c)});
}
function markSeen(card){if(card.dataset.seen)return;card.dataset.seen='1';state.seen++;save('watermelons-seen',state.seen);updateStreak();}
function updateStreak(){
 const today=new Date().toISOString().slice(0,10);const last=state.streak.last;
 if(last===today)return;
 const yesterday=new Date(Date.now()-86400000).toISOString().slice(0,10);
 state.streak.count=last===yesterday?state.streak.count+1:1;state.streak.last=today;save('watermelons-streak',state.streak);
}
feed.addEventListener('scroll',()=>{if(state.tab==='feed'&&feed.scrollTop+feed.clientHeight>=feed.scrollHeight-700){const items=nextBatch(6);items.forEach(x=>feed.appendChild(card(x)));observeCards();}});

 document.getElementById('startBtn').onclick=()=>{state.onboarding=true;localStorage.setItem('watermelons-onboarded','1');closeSheet();renderFeed(nextBatch(8));};
}

function wmToday(){return new Date().toISOString().slice(0,10)}
function wmRefreshQuest(){
  const today=wmToday();
  if(wmQuest.day!==today) wmQuest={day:today,seen:0,quiz:0,saved:0};
  const done=Math.min(wmQuest.seen,3);

  wmXP+=n; localStorage.setItem(wmXPKey,String(wmXP)); wmRefreshQuest();

}
function wmApplyTheme(k){
  Object.values(WM_THEMES).forEach(t=>t.cls&&document.body.classList.remove(t.cls));

  document.querySelectorAll('[data-wm-theme]').forEach(b=>b.onclick=()=>{wmApplyTheme(b.dataset.wmTheme);closeSheet();toast(WM_THEMES[b.dataset.wmTheme].icon+' '+WM_THEMES[b.dataset.wmTheme].name+' activated');});
}
document.getElementById('themeBtn').onclick=wmThemeSheet;
wmApplyTheme(wmTheme);

/* Reward normal actions so the learning loop has a little game underneath it. */
const wmOriginalToggleSave=toggleSave;
toggleSave=function(id,el){
  const before=state.saved.includes(id);
  wmOriginalToggleSave(id,el);
  if(!before){wmQuest.saved++;wmAddXP(5,'saved');}
  save(wmQuestKey,wmQuest);wmRefreshQuest();
};
const wmOriginalAnswerQuiz=answerQuiz;
answerQuiz=function(item,el,choice){
  const before=state.attempted;
  wmOriginalAnswerQuiz(item,el,choice);
  if(state.attempted>before){
    const ok=choice===item.answer;
    wmQuest.quiz++;
    wmAddXP(ok?15:3,ok?'nailed it':'good try');

  }
};
const wmOriginalMarkSeen=markSeen;
markSeen=function(card){
  const before=state.seen;

    wmQuest.seen++;
    wmAddXP(2,'discovered');
    save(wmQuestKey,wmQuest);wmRefreshQuest();
  }
};
