<style>
:root{--ink:#263329;--muted:#697568;--paper:#f8f2e2;--cream:#fffaf0;--sage:#738965;--sage-dark:#43553e;--line:rgba(54,70,53,.15);--shadow:0 18px 45px rgba(31,45,31,.22)}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#dfe6d3;color:var(--ink)}body{overflow:hidden}.app-shell{height:100dvh;max-width:560px;margin:auto;position:relative;background:#edf1df;overflow:hidden}.topbar{height:82px;padding:14px 18px 8px;display:flex;justify-content:space-between;align-items:center;background:rgba(248,249,235,.88);backdrop-filter:blur(14px);position:relative;z-index:5;border-bottom:1px solid var(--line)}.eyebrow{font-size:9px;letter-spacing:.16em;font-weight:800;color:var(--sage-dark)}h1{font:700 25px Georgia,serif;margin:2px 0 0}.icon-btn,.close-btn{border:0;background:rgba(67,85,62,.08);width:40px;height:40px;border-radius:50%;font-size:19px;color:var(--ink);cursor:pointer}.feed{height:calc(100dvh - 82px - 72px);overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}.feed::-webkit-scrollbar{display:none}.card{min-height:100%;scroll-snap-align:start;position:relative;padding:26px 20px 28px;display:flex;align-items:flex-end;background:#60705c;isolation:isolate}.card:before{content:"";position:absolute;inset:0;z-index:-2;background:var(--bg);background-size:cover;background-position:center}.card:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(18,27,18,.06),rgba(18,27,18,.08) 28%,rgba(18,27,18,.82) 100%)}.card[data-theme="psychology"]{--bg:radial-gradient(circle at 22% 20%,#d6e6e8 0,#92b3b5 25%,#516d68 55%,#243a35 100%)}.card[data-theme="philosophy"]{--bg:linear-gradient(135deg,#c6aa7c,#e1cfaa 43%,#718269 70%,#3b4e3c)}.card[data-theme="mythology"]{--bg:linear-gradient(135deg,#d6a26b,#8c6c4a 43%,#536d52 68%,#263d30)}.card[data-theme="faith"]{--bg:linear-gradient(135deg,#f0d28b,#ad9d69 36%,#67825f 66%,#304a37)}.card[data-theme="fitness"]{--bg:linear-gradient(135deg,#b7a580,#71856b 44%,#3f5845 68%,#1e3229)}.card[data-theme="history"]{--bg:linear-gradient(135deg,#e0c08d,#a08460 42%,#66654c 68%,#333e32)}.card[data-theme="science"]{--bg:radial-gradient(circle at 75% 18%,#c7d8ee 0,#8193b3 25%,#4b5d78 55%,#202d40 100%)}.card[data-theme="literature"]{--bg:linear-gradient(135deg,#b9a58a,#7d765e 45%,#4d5d4d 70%,#27372e)}.content{width:100%;max-width:480px;margin:auto auto 0}.card-top{display:flex;justify-content:space-between;align-items:center}.pill{display:inline-flex;padding:7px 10px;border-radius:999px;background:rgba(20,30,22,.55);color:#fff;font-size:11px;font-weight:700;backdrop-filter:blur(8px)}.topic-dot{font-size:20px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}.card h2{font:700 clamp(29px,7vw,43px)/1.02 Georgia,serif;color:white;margin:12px 0 10px;letter-spacing:-.02em}.card .dek{font-size:15px;line-height:1.45;color:#f8f7ed;max-width:440px;margin:0 0 15px}.paper{background:rgba(255,250,240,.94);border:1px solid rgba(255,255,255,.5);border-radius:22px;padding:16px 17px;color:var(--ink);box-shadow:var(--shadow);margin:13px 0}.paper p{margin:0 0 9px;line-height:1.45;font-size:14px}.paper p:last-child{margin-bottom:0}.quote{font:italic 19px/1.35 Georgia,serif}.byline{font-size:12px!important;color:var(--muted);font-weight:700}.actions,.sub-actions{display:flex;gap:8px;align-items:center;margin-top:10px}.actions button,.sub-actions button,.cta{border:1px solid rgba(255,255,255,.25);background:rgba(30,42,30,.56);color:#fff;border-radius:999px;padding:10px 12px;font-weight:700;cursor:pointer;backdrop-filter:blur(8px);font-size:12px}.actions button.saved{background:#f4efd9;color:var(--ink)}.actions .grow,.sub-actions .grow{flex:1}.sub-actions{margin-top:7px}.sub-actions button{background:transparent;border-color:rgba(255,255,255,.15);font-size:11px}.quiz-options{display:grid;gap:8px}.quiz-options button{padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#f7f2e5;text-align:left;color:var(--ink);cursor:pointer}.quiz-options button:disabled{opacity:1}.quiz-options button.correct{outline:2px solid #728d61;background:#edf5e7}.quiz-options button.wrong{outline:2px solid #a65c4d;background:#f8e9e4}.quiz-result{font-size:12px!important;font-weight:700;margin-top:10px!important}.quiz-result.good{color:#4e7444}.quiz-result.bad{color:#9a5144}.bottom-nav{height:72px;position:absolute;bottom:0;left:0;right:0;background:rgba(248,249,235,.94);backdrop-filter:blur(16px);display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);z-index:10}.nav-btn{border:0;background:none;color:#71806e;font-weight:700;font-size:19px;cursor:pointer}.nav-btn span{display:block;font-size:10px;margin-top:2px}.nav-btn.active{color:var(--sage-dark)}.sheet{position:fixed;inset:0;z-index:50}.sheet.hidden{display:none}.sheet-backdrop{position:absolute;inset:0;background:rgba(22,29,22,.42);backdrop-filter:blur(4px)}.sheet-card{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);max-height:90dvh;overflow:auto;background:var(--cream);border-radius:28px 28px 0 0;padding:28px 22px 36px;box-shadow:0 -20px 60px rgba(0,0,0,.2)}.close-btn{position:absolute;right:18px;top:16px}.sheet-card h2{font:700 30px Georgia,serif;margin:0 40px 10px 0}.sheet-card h3{font:700 16px Georgia,serif;margin:22px 0 10px}.sheet-card p{line-height:1.5;color:var(--muted)}.sheet-kicker{font-size:10px;letter-spacing:.13em;font-weight:900;color:var(--sage-dark);margin-bottom:7px}.topic-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.topic{border:1px solid var(--line);border-radius:18px;padding:14px;background:#f3eedf;text-align:left;cursor:pointer;color:var(--ink)}.topic.selected{background:#dfe9d4;border-color:#738965;box-shadow:inset 0 0 0 1px #738965}.topic strong{display:block;margin-top:6px}.topic small{display:block;color:var(--muted);line-height:1.3;margin-top:4px}.segmented{display:flex;gap:7px}.segmented button{flex:1;border:1px solid var(--line);background:#f3eedf;padding:11px;border-radius:13px;font-weight:800;color:var(--ink)}.segmented button.selected{background:var(--sage-dark);color:#fff}.range-label{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11px}.range-label input{flex:1;accent-color:var(--sage-dark)}.cta{display:block;width:100%;background:var(--sage-dark);padding:13px;margin-top:14px;font-size:14px}.danger-btn{border:0;background:transparent;color:#9a5144;font-weight:800;padding:16px 0;cursor:pointer}.request-box{background:#f3eedf;border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:18px}.request-box h3{margin-top:0}.request{display:flex;gap:8px;margin-top:12px}.request input{flex:1;border:1px solid var(--line);border-radius:14px;padding:13px;background:white;font:inherit;min-width:0}.request button{border:0;border-radius:14px;padding:0 15px;background:var(--sage-dark);color:white;font-weight:800}.trail{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:18px 0}.trail span{background:#f1ead8;border:1px solid var(--line);padding:8px 10px;border-radius:999px;font-size:12px;font-weight:700}.trail b{color:var(--muted)}.mini-list{display:grid;gap:7px}.mini-list button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#f3eedf;border-radius:15px;padding:10px;text-align:left}.mini-list button span{font-size:20px}.mini-list button div{flex:1}.mini-list strong,.mini-list small{display:block}.mini-list small{color:var(--muted);margin-top:2px}.mini-list b{font-size:20px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f0ebdc;border-radius:18px;padding:16px;text-align:center}.stat b{display:block;font:700 25px Georgia,serif}.stat span{font-size:11px;color:var(--muted)}.journey-paper{margin-top:14px}.big-number{font:700 34px Georgia,serif!important;color:var(--ink)!important;margin:0!important}.shelf-chip{display:inline-block;background:#f0ead9;border:1px solid var(--line);border-radius:999px;padding:7px 9px;margin:3px;font-size:11px;font-weight:700}.welcome{text-align:center;padding-top:8px}.melon{font-size:60px;margin-bottom:8px}.welcome h2{margin-left:0!important}.welcome-points{display:grid;gap:8px;text-align:left;margin:18px 0}.welcome-points span{background:#f2ecdc;border-radius:14px;padding:11px;font-size:13px}.install-prompt{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);width:min(520px,calc(100% - 24px));z-index:30;background:rgba(255,250,240,.97);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px;padding:12px 13px;display:flex;align-items:center;gap:9px}.install-prompt.hidden{display:none}.install-prompt div{flex:1}.install-prompt strong,.install-prompt span{display:block}.install-prompt strong{font-size:12px}.install-prompt span{font-size:11px;color:var(--muted);margin-top:2px}.install-prompt button{border:0;border-radius:12px;background:var(--sage-dark);color:white;padding:9px 13px;font-weight:800}.install-prompt .mini-close{background:transparent;color:var(--muted);padding:5px;font-size:18px}.toast{position:fixed;z-index:100;left:50%;bottom:100px;transform:translateX(-50%);background:#263329;color:white;padding:10px 14px;border-radius:999px;font-size:12px;font-weight:800;box-shadow:var(--shadow)}
@media(min-width:700px){body{padding:18px}.app-shell{border-radius:32px;box-shadow:0 20px 80px rgba(31,45,31,.22);height:calc(100dvh - 36px)}}


/* WATERMELONS FUN EDITION */

.top-actions{display:flex;gap:7px}
.quest-strip{height:50px;display:flex;align-items:center;justify-content:space-between;padding:7px 14px;background:rgba(255,250,240,.78);border-bottom:1px solid var(--line);backdrop-filter:blur(12px);position:relative;z-index:4}
.quest-copy{display:flex;align-items:center;gap:9px;min-width:0}.quest-copy>span{font-size:20px}.quest-copy b,.quest-copy small{display:block}.quest-copy b{font-size:11px}.quest-copy small{font-size:10px;color:var(--muted);margin-top:1px}
.xp-pill{border:1px solid rgba(67,85,62,.18);background:#eef1df;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:900;color:var(--sage-dark)}
.feed{height:calc(100dvh - 82px - 50px - 72px)}
.card{transition:transform .2s ease}.card:hover{transform:scale(.995)}
.card .content{animation:wmIn .35s ease both}
@keyframes wmIn{from{opacity:.65;transform:translateY(10px)}to{opacity:1;transform:none}}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.topic-dot{font-size:25px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.22))}
.card .paper{backdrop-filter:blur(5px)}
.actions button,.sub-actions button{transition:transform .12s ease,background .12s ease}.actions button:active,.sub-actions button:active{transform:scale(.95)}
.actions .save.saved{background:#fff3b0!important;color:#5f531d!important}
.quest-complete{animation:wmPop .55s ease}.xp-float{position:fixed;z-index:120;left:50%;top:42%;pointer-events:none;font-weight:1000;font-size:22px;color:#fff7c7;text-shadow:0 3px 12px rgba(0,0,0,.35);animation:xpFloat 900ms ease forwards}
@keyframes xpFloat{0%{opacity:0;transform:translate(-50%,20px) scale(.7)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-70px) scale(1.15)}}
@keyframes wmPop{0%,100%{transform:scale(1)}45%{transform:scale(1.08)}}
.theme-card{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.theme-choice{border:0;border-radius:18px;min-height:110px;padding:13px;text-align:left;color:white;position:relative;overflow:hidden;font-weight:800;box-shadow:0 8px 20px rgba(31,45,31,.12)}
.theme-choice span{font-size:28px;display:block;margin-bottom:8px}.theme-choice small{display:block;font-size:10px;opacity:.86;margin-top:3px}
.theme-meadow{background:linear-gradient(145deg,#8aa47c,#355342)}.theme-ancient{background:linear-gradient(145deg,#c7a36a,#66533b)}.theme-pirate{background:linear-gradient(145deg,#244c59,#162832)}.theme-night{background:linear-gradient(145deg,#37305c,#141626)}.theme-sunrise{background:linear-gradient(145deg,#d38a5d,#6b4a49)}
body.wm-ancient .app-shell{background:#eee2c8}body.wm-ancient .topbar,body.wm-ancient .quest-strip{background:rgba(244,235,213,.88)}
body.wm-pirate .app-shell{background:#dce8e6}body.wm-pirate .topbar,body.wm-pirate .quest-strip{background:rgba(235,244,242,.9)}
body.wm-night .app-shell{background:#1d2130;color:#f5f0df}body.wm-night .topbar,body.wm-night .quest-strip{background:rgba(25,29,43,.9);color:#f5f0df}body.wm-night h1,body.wm-night .icon-btn{color:#f5f0df}body.wm-night .quest-copy small{color:#b8bfcc}body.wm-night .xp-pill{background:#2b3044;color:#f5e7a7;border-color:#4b536b}
body.wm-sunrise .app-shell{background:#f5e2d2}body.wm-sunrise .topbar,body.wm-sunrise .quest-strip{background:rgba(255,244,235,.88)}


/* WORLDS + SOUNDS */
.map-view{height:100%;overflow:auto;padding:16px 14px 28px;background:#e8d4a7;color:#332b20}
.map-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:10px}
.map-head h2{font:700 28px Georgia,serif;margin:0}.map-head p{font-size:11px;color:#6e604c;margin:3px 0 0}
.map-paper{position:relative;min-height:570px;border-radius:22px;overflow:hidden;border:1px solid rgba(75,57,34,.22);box-shadow:0 14px 35px rgba(66,48,28,.18);background:
radial-gradient(circle at 20% 20%,rgba(255,250,220,.9),transparent 26%),
radial-gradient(circle at 78% 75%,rgba(130,105,62,.18),transparent 25%),
linear-gradient(135deg,#e9d39f,#cda86c 45%,#e3c98f)}
.map-paper:before{content:"";position:absolute;inset:0;opacity:.23;background-image:radial-gradient(#513f26 0.7px,transparent .7px);background-size:7px 7px;pointer-events:none}
.map-title{position:absolute;top:18px;left:50%;transform:translateX(-50%);font:700 24px Georgia,serif;color:#5a452a;white-space:nowrap;letter-spacing:.04em}
.compass{position:absolute;right:18px;top:18px;font-size:40px;filter:sepia(1) saturate(.7);opacity:.72}
.route{position:absolute;border-top:2px dashed rgba(83,61,34,.42);width:34%;transform-origin:left center;pointer-events:none}
.route.r1{left:16%;top:38%;width:48%;transform:rotate(-8deg)}.route.r2{left:45%;top:53%;width:40%;transform:rotate(17deg)}.route.r3{left:25%;top:70%;width:52%;transform:rotate(9deg)}
.island{position:absolute;border:2px solid rgba(84,60,32,.42);box-shadow:inset 0 0 0 2px rgba(255,245,205,.25);background:rgba(105,125,77,.28);border-radius:53% 47% 60% 40%/44% 57% 43% 56%;transform:rotate(-7deg)}
.island.i1{width:210px;height:115px;left:6%;top:25%;}.island.i2{width:165px;height:105px;right:5%;top:38%;transform:rotate(12deg)}.island.i3{width:190px;height:120px;left:30%;bottom:7%;transform:rotate(3deg)}.island.i4{width:120px;height:78px;right:18%;top:18%;transform:rotate(-18deg)}
.world-pin{position:absolute;z-index:2;border:1px solid rgba(65,47,26,.25);border-radius:16px;padding:9px 11px;text-align:left;min-width:126px;background:rgba(255,244,211,.92);color:#46361f;box-shadow:0 7px 18px rgba(64,45,25,.15);cursor:pointer}
.world-pin b{display:block;font:700 15px Georgia,serif}.world-pin small{display:block;margin-top:3px;font-size:9px;color:#77654c}.world-pin span{font-size:20px;float:left;margin-right:6px}
.world-pin:hover{transform:translateY(-2px)}.pin-psych{left:10%;top:35%}.pin-phil{left:40%;top:47%}.pin-myth{right:8%;top:31%}.pin-faith{right:14%;bottom:23%}.pin-fit{left:8%;bottom:17%}.pin-history{left:40%;bottom:23%}.pin-science{right:9%;bottom:9%}.pin-lit{left:38%;top:15%}
.map-legend{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.map-chip{background:rgba(255,244,211,.86);border:1px solid rgba(75,57,34,.18);border-radius:999px;padding:7px 9px;font-size:10px;font-weight:800;color:#5c482b}
.sound-on{background:#e6efcf!important;color:#314a2c!important}.sound-pulse{animation:soundPulse 1.8s ease-in-out infinite}
@keyframes soundPulse{50%{transform:scale(1.08)}}


/* WATERMELONS 2.0: HOLOGRAPHIC STUDY DECK */
:root{--cyan:#79e8ff;--violet:#b69cff;--gold:#ffd77a;--hud:rgba(9,18,25,.78)}
body{background:#071116}
.app-shell{background:radial-gradient(circle at 50% -10%,rgba(102,220,214,.12),transparent 32%),#0a151b}
.topbar{background:rgba(8,18,23,.72);border-bottom:1px solid rgba(121,232,255,.14);box-shadow:0 8px 35px rgba(0,0,0,.18)}
.eyebrow{color:#79d9d0}h1{color:#f2fbf8;letter-spacing:.02em}.icon-btn{background:rgba(121,232,255,.07);color:#d9f8f5;border:1px solid rgba(121,232,255,.12);box-shadow:inset 0 0 18px rgba(121,232,255,.04)}
.quest-strip{background:rgba(7,17,22,.68);border-bottom:1px solid rgba(121,232,255,.11);color:#edfdfa}.quest-copy small{color:#8fa9a8}.xp-pill{background:rgba(121,232,255,.08);border-color:rgba(121,232,255,.18);color:#bff7f0}
.feed{background:#071116}.card{overflow:hidden;background:#071116}.card:before{filter:saturate(1.12) contrast(1.05);transform:scale(1.02)}
.card:after{background:linear-gradient(180deg,rgba(4,10,13,.02),rgba(4,10,13,.08) 28%,rgba(3,9,12,.9) 100%)}
.card:global{} .card:before{animation:wmBreathe 14s ease-in-out infinite alternate}
.card .content{position:relative}.card .content:before{content:"";position:absolute;left:-16px;right:-16px;bottom:-20px;height:190px;background:radial-gradient(ellipse at 50% 100%,rgba(121,232,255,.09),transparent 65%);pointer-events:none;z-index:-1}
.card h2{text-shadow:0 3px 22px rgba(0,0,0,.4)}
.card-top .pill{border:1px solid rgba(121,232,255,.18);background:rgba(6,16,20,.55);box-shadow:0 0 20px rgba(121,232,255,.05)}
.paper{background:rgba(246,250,241,.94);box-shadow:0 16px 50px rgba(0,0,0,.26),0 0 30px rgba(121,232,255,.05);border-color:rgba(255,255,255,.5)}
.actions button,.sub-actions button{background:rgba(5,15,19,.62);border-color:rgba(121,232,255,.16);box-shadow:0 0 18px rgba(121,232,255,.04)}
.bottom-nav{background:rgba(7,16,21,.88);border-top:1px solid rgba(121,232,255,.13);grid-template-columns:repeat(5,1fr);box-shadow:0 -12px 35px rgba(0,0,0,.2)}.nav-btn{color:#76908e}.nav-btn.active{color:#79e8ff;text-shadow:0 0 15px rgba(121,232,255,.6)}
.nav-btn.active:after{content:"";display:block;width:18px;height:2px;margin:3px auto 0;background:#79e8ff;border-radius:4px;box-shadow:0 0 12px #79e8ff}
@keyframes wmBreathe{from{transform:scale(1.02) translate3d(0,0,0)}to{transform:scale(1.07) translate3d(-1%,1%,0)}}
@keyframes wmScan{0%{transform:translateY(-100%);opacity:0}10%,90%{opacity:.18}100%{transform:translateY(100%);opacity:0}}
@keyframes wmPulse{50%{box-shadow:0 0 0 5px rgba(121,232,255,.03),0 0 28px rgba(121,232,255,.28)}}

/* cinematic map console */
.map-view{position:relative;background:radial-gradient(circle at 50% 20%,#122d35 0,#071116 52%,#04090c 100%);color:#dffaf6;padding:16px 12px 28px}
.map-view:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.14;background:repeating-linear-gradient(0deg,transparent 0,transparent 3px,rgba(121,232,255,.08) 4px);mix-blend-mode:screen}
.map-head{align-items:center;padding:4px 4px 12px}.map-head h2{font-family:ui-sans-serif,system-ui,sans-serif;font-size:27px;letter-spacing:-.04em;color:#effffd}.map-head p{color:#789b9c}.map-head .sheet-kicker{color:#6ee3df;letter-spacing:.18em}
.map-paper{min-height:720px;border-radius:26px;border:1px solid rgba(121,232,255,.24);background:radial-gradient(circle at 50% 50%,rgba(41,106,116,.2),transparent 38%),linear-gradient(145deg,#0d222a,#08151b 52%,#0b1b20);box-shadow:inset 0 0 70px rgba(121,232,255,.06),0 20px 70px rgba(0,0,0,.42);overflow:hidden}
.map-paper:before{opacity:.16;background-image:linear-gradient(rgba(121,232,255,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(121,232,255,.13) 1px,transparent 1px);background-size:34px 34px}
.map-paper:after{content:"";position:absolute;left:0;right:0;top:0;height:35%;background:linear-gradient(transparent,rgba(121,232,255,.07),transparent);animation:wmScan 7s linear infinite;pointer-events:none}
.map-title{top:17px;color:#d9fffa;font-family:ui-sans-serif,system-ui,sans-serif;font-size:12px;letter-spacing:.28em;text-shadow:0 0 18px rgba(121,232,255,.7)}

const BANK = [
  {theme:'psychology',type:'concept',tag:'Psychology · Cognition',title:'The Spacing Effect',dek:'Memory often benefits when learning is spread out instead of crammed together.',body:'Spacing creates repeated retrieval opportunities across time. A little forgetting between study sessions can make later retrieval more effortful, and that effort can strengthen learning.'},
  {theme:'psychology',type:'concept',tag:'Psychology · Attention',title:'Change Blindness',dek:'Sometimes a surprisingly large visual change can slip past attention.',body:'When attention is occupied or visual information is interrupted, people can miss changes they would easily notice if they were looking specifically for them. Attention is selective, not a perfect recording device.'},
  {theme:'psychology',type:'concept',tag:'Psychology · Memory',title:'The Testing Effect',dek:'Trying to remember can teach you more than rereading the answer.',body:'Retrieval practice can strengthen later recall. A short quiz before looking at an explanation turns passive exposure into an active memory event.'},
  {theme:'psychology',type:'concept',tag:'Psychology · Learning',title:'Desirable Difficulty',dek:'Some kinds of difficulty during practice can improve later retention.',body:'Interleaving, spacing, and retrieval can feel harder than rereading, yet that difficulty can produce stronger long-term learning. The trick is useful challenge, not needless frustration.'},
  {theme:'philosophy',type:'quote',tag:'Philosophy · Aristotle',title:'A Life of Practice',quote:'“We are what we repeatedly do.”',byline:'A concise modern formulation associated with an idea in Aristotle’s Nicomachean Ethics.',body:'Aristotle’s broader account of virtue emphasizes habituation: character develops through repeated choices and practices, not merely through knowing what is good.'},
  {theme:'philosophy',type:'concept',tag:'Philosophy · Stoicism',title:'What Is in Your Control?',dek:'A central Stoic move is to separate your judgments and actions from events outside your command.',body:'Epictetus repeatedly distinguishes what depends on us from what does not. The point is not passive resignation. It is to focus effort where agency actually exists.'},
  {theme:'philosophy',type:'concept',tag:'Philosophy · Existentialism',title:'Meaning Is a Question',dek:'Existentialist thinkers often treat meaning as something we have to confront rather than simply receive.',body:'Different existentialists disagree sharply about God, freedom, and meaning. What connects many of them is sustained attention to choice, responsibility, mortality, and the problem of how to live.'},
  {theme:'mythology',type:'myth',tag:'Greek Mythology · Athena',title:'Why Athena Has an Unusual Birth',dek:'Athena’s birth from Zeus’s head is more than an odd family story.',body:'In a famous mythic tradition, Zeus swallows Metis and later suffers a terrible headache. Hephaestus opens Zeus’s head, and Athena emerges armed. The story links Athena with wisdom, strategy, and Zeus’s sovereignty.'},
  {theme:'mythology',type:'myth',tag:'Greek Mythology · Odysseus',title:'Why Odysseus Needed the Mast',dek:'The Sirens story is an experiment in planning around your future self.',body:'Odysseus wants to hear the Sirens without steering the ship toward danger. He orders his crew to plug their ears, bind him to the mast, and obey his earlier instructions even if he later begs to be released.'},
  {theme:'mythology',type:'myth',tag:'Greek Mythology · Sisyphus',title:'The Boulder Keeps Coming Back',dek:'Sisyphus became one of mythology’s clearest images of endless labor.',body:'Sisyphus is condemned to push a boulder uphill only to watch it roll back down. Later philosophical interpretations, especially Camus’s, use the myth to ask what it means to live under conditions that do not supply an obvious final resolution.'},
  {theme:'faith',type:'faith',tag:'Christian Faith · Romans',title:'Renewing Your Mind',dek:'Romans 12:2 connects transformed thinking with transformed living.',body:'Paul places the famous phrase inside a larger appeal to embodied, communal Christian life. The passage is not simply a command to collect more information. It concerns discernment, changed patterns, and a life oriented toward what is good.'},
  {theme:'faith',type:'faith',tag:'Christian Faith · Gospel',title:'What Does “Gospel” Mean?',dek:'The word “gospel” originally carried the sense of good news.',body:'In the New Testament, gospel refers to the proclaimed good news about Jesus. It is not merely a genre of four books. Matthew, Mark, Luke, and John are later called Gospels because they present narratives centered on that proclamation.'},
  {theme:'faith',type:'faith',tag:'Christian Faith · Early Church',title:'Why the Early Church Memorized So Much',dek:'Before every believer could carry a printed Bible in a pocket, memory mattered.',body:'Early Christian communities relied heavily on oral teaching, repeated readings, hymns, prayers, and communal practices. Memorization was not just an academic exercise. It helped preserve teaching across communities and generations.'},
  {theme:'fitness',type:'concept',tag:'Lifting & Nutrition · Hypertrophy',title:'Mechanical Tension',dek:'Muscle growth is strongly related to the tension experienced by muscle fibers during resistance training.',body:'Hard sets that challenge the target muscle provide a stimulus for adaptation. Exercise selection, load, range of motion, proximity to failure, volume, and recovery all influence how useful that stimulus becomes.'},
  {theme:'fitness',type:'concept',tag:'Lifting & Nutrition · Recovery',title:'Muscle Is Built Between Sessions',dek:'Training provides the stimulus. Recovery gives the body room to adapt.',body:'Sleep, sufficient energy, protein, and time between hard sessions all matter. More training is not automatically more growth if fatigue keeps accumulating faster than adaptation.'},
  {theme:'fitness',type:'concept',tag:'Lifting & Nutrition · Nutrition',title:'Protein Distribution',dek:'Total daily protein matters, but spreading intake across the day can make a practical diet easier to manage.',body:'A protein-rich meal or snack at several points in the day gives you repeated opportunities to supply amino acids. You do not need a perfectly timed anabolic clock. Consistency is the useful part.'},
  {theme:'history',type:'concept',tag:'History · Rome',title:'Roman Concrete Had a Strange Advantage',dek:'Some Roman concrete structures have survived for centuries in harsh environments.',body:'Roman concrete used volcanic materials in mixtures that could behave differently from modern Portland cement. Researchers continue to study why some ancient structures, especially marine ones, remain remarkably durable.'},
  {theme:'history',type:'concept',tag:'History · Writing',title:'Books Used to Be Hand-Made Objects',dek:'For much of history, a book meant someone had to make it page by page.',body:'Before industrial printing, producing a manuscript could require prepared animal skin or paper, ink, scribes, binding, and enormous amounts of labor. A library represented a substantial investment of time and material.'},
  {theme:'science',type:'concept',tag:'Science · Astronomy',title:'A Light-Year Is a Distance',dek:'Despite its name, a light-year measures how far light travels in a year.',body:'Light moves through vacuum at about 299,792 kilometers per second. Multiply that enormous speed by a year and you get a distance of roughly 9.46 trillion kilometers.'},
  {theme:'science',type:'concept',tag:'Science · Biology',title:'Your Cells Have Tiny Recycling Systems',dek:'Cells continually break down and reuse components.',body:'Processes such as autophagy help cells deliver damaged or unnecessary components for breakdown and recycling. It is part of ordinary cellular maintenance, not a mysterious detox switch.'},
  {theme:'literature',type:'concept',tag:'Literature · Reading',title:'An Unreliable Narrator Changes the Game',dek:'A narrator can tell a story without giving you a perfectly trustworthy account of it.',body:'When a narrator is unreliable, readers have to compare what is said with what the story itself reveals. The technique can create suspense, irony, comedy, or a gradual shift in how we understand the characters.'},
  {theme:'literature',type:'concept',tag:'Literature · Myth',title:'Stories Travel by Changing',dek:'A story can survive precisely because later cultures reshape it.',body:'Myths and literary traditions are often retold rather than preserved as a single fixed text. Comparing versions can reveal what different communities valued, feared, or wanted the story to mean.'}
];

 {theme:'philosophy',tag:'Philosophy · Quick Check',title:'Stoic Control',dek:'Which situation most closely fits the Stoic distinction about control?',options:['Controlling exactly what another person thinks','Choosing your response to an insult','Guaranteeing tomorrow’s weather','Making everyone like your work'],answer:1,explain:'The Stoic focus is on what depends on you, such as your judgments and responses, rather than outcomes controlled by other people or events.'},

 saved: load('watermelons-saved', []),
 seen: load('watermelons-seen', 0),
 correct: load('watermelons-correct', 0),
 attempted: load('watermelons-attempted', 0),
 skipped: load('watermelons-skipped', 0),
 streak: load('watermelons-streak', {count:0,last:null}),
 generated: load('watermelons-generated', []),
 tab:'feed',
 cursor:0,
 onboarding: localStorage.getItem('watermelons-onboarded') === '1'
};

const feed = document.getElementById('feed');
let deferredInstall = null;

function load(key, fallback){try{const x=JSON.parse(localStorage.getItem(key));return x ?? fallback}catch{return fallback}}
function save(key,value){localStorage.setItem(key,JSON.stringify(value))}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function topic(id){return TOPICS.find(t=>t.id===id)||TOPICS[0]}
function selectedTopics(){return state.prefs.topics.length?state.prefs.topics:TOPICS.map(t=>t.id)}
function pool(){
  const ids=new Set(selectedTopics());
  const base=BANK.filter(x=>ids.has(x.theme));
  const quizzes=QUIZZES.filter(x=>ids.has(x.theme)).map(q=>({...q,type:'quiz',id:'quiz-'+q.theme+'-'+Math.random().toString(36).slice(2,7)}));
  return [...base,...state.generated,...quizzes];
}
function makeId(item){return item.id || (item.theme+'-'+item.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,40))}
function uniqueItems(items){
  const seenIds=new Set();
  return items.filter(x=>{x.id=makeId(x); if(seenIds.has(x.id))return false; seenIds.add(x.id); return true;});
}
function nextBatch(n=8){
  let items=uniqueItems(pool());
  if(state.prefs.shuffle) items.sort(()=>Math.random()-.5);
  const out=[];
  while(out.length<n){
    if(items.length){out.push(items.shift());}
    else {generateLocal(12); items=uniqueItems(pool()).filter(x=>!out.some(y=>y.id===x.id));}
  }
  return out;
}
function generateLocal(n=12, request=''){
  const words=request.toLowerCase();
  let relevant= BANK.filter(x=>!request || x.title.toLowerCase().includes(words)||x.body?.toLowerCase().includes(words)||x.dek?.toLowerCase().includes(words));
  if(!relevant.length) relevant=BANK.filter(x=>selectedTopics().includes(x.theme));
  if(!relevant.length) relevant=BANK;
  const made=[];
  for(let i=0;i<n;i++){
    const src=relevant[(state.cursor+i)%relevant.length];
    const variants=[
      {dek:'A small question worth carrying with you: '+src.title+'.',body:src.body||src.quote||src.dek,type:'reflection'},
      {dek:'Look at this idea from another angle.',body:(src.body||src.dek)+' What changes if you connect it to something you already know?',type:'connection'},
      {dek:'Try to explain this without looking back.',body:src.body||src.dek,type:'recall'}
    ];
    const v=variants[(state.cursor+i)%variants.length];
    made.push({...src,...v,id:'gen-'+Date.now()+'-'+i+'-'+Math.random().toString(36).slice(2,7),tag:src.tag+' · Wander'});
  }
  state.generated=[...state.generated,...made].slice(-120);
  state.cursor+=n;
  save('watermelons-generated',state.generated);
  return made;
}

function renderFeed(items=nextBatch(8), append=false){
  if(!append) feed.innerHTML='';
  items.forEach(item=>feed.appendChild(card(item)));
  observeCards();
}
function card(item){
  const el=document.createElement('article');
  el.className='card'; el.dataset.theme=item.theme; el.dataset.id=item.id;
  const saved=state.saved.includes(item.id);
  let inner=`<div class="content"><div class="card-top"><span class="pill">${esc(item.tag)}</span><span class="topic-dot">${topic(item.theme).icon}</span></div><h2>${esc(item.title)}</h2><p class="dek">${esc(item.dek||'')}</p>`;
  if(item.type==='quote') inner+=`<div class="paper"><p class="quote">${esc(item.quote)}</p><p class="byline">${esc(item.byline||'')}</p>${item.body?`<p>${esc(item.body)}</p>`:''}</div>`;
  else if(item.type==='quiz') inner+=`<div class="paper"><div class="quiz-options">${item.options.map((x,i)=>`<button data-q="${i}">${String.fromCharCode(65+i)} · ${esc(x)}</button>`).join('')}</div><p id="result-${item.id}" class="quiz-result"></p></div>`;
  else inner+=`<div class="paper"><p>${esc(item.body||'')}</p></div>`;
  inner+=`<div class="actions"><button class="save ${saved?'saved':''}" data-save="${esc(item.id)}">${saved?'★ Saved':'☆ Save'}</button><button data-more="${esc(item.theme)}">More like this</button><button data-share="${esc(item.id)}">Share</button></div><div class="sub-actions"><button data-not="${esc(item.id)}">Not for me</button><button class="grow" data-related="${esc(item.id)}">Explore this idea →</button></div></div>`;
  el.innerHTML=inner;
  el.querySelector('[data-save]').onclick=()=>toggleSave(item.id,el);
  el.querySelector('[data-more]').onclick=()=>showMore(item.theme);
  el.querySelector('[data-related]').onclick=()=>openExplore(item);
  el.querySelector('[data-share]').onclick=()=>shareItem(item);
  el.querySelector('[data-not]').onclick=()=>{state.skipped++;save('watermelons-skipped',state.skipped);el.remove();};
  el.querySelectorAll('[data-q]').forEach(btn=>btn.onclick=()=>answerQuiz(item,el,Number(btn.dataset.q)));
  return el;
}
function answerQuiz(item,el,choice){
  const buttons=[...el.querySelectorAll('[data-q]')]; buttons.forEach(b=>b.disabled=true);
  const ok=choice===item.answer; buttons[choice].classList.add(ok?'correct':'wrong'); if(!ok)buttons[item.answer].classList.add('correct');
  state.attempted++; if(ok)state.correct++; save('watermelons-attempted',state.attempted);save('watermelons-correct',state.correct);
  const r=el.querySelector('.quiz-result');r.textContent=ok?'Correct. '+item.explain:'Not quite. '+item.explain;r.className='quiz-result '+(ok?'good':'bad');
}
function toggleSave(id,el){
  state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];save('watermelons-saved',state.saved);
  const b=el.querySelector('[data-save]');const yes=state.saved.includes(id);b.classList.toggle('saved',yes);b.textContent=yes?'★ Saved':'☆ Save';
}
function showMore(theme){state.prefs.topics=[theme,...state.prefs.topics.filter(x=>x!==theme)];save('watermelons-prefs',state.prefs);renderFeed(BANK.filter(x=>x.theme===theme).concat(generateLocal(8)).slice(0,10));feed.scrollTo({top:0,behavior:'smooth'});}
function openExplore(item){
  const t=topic(item.theme);
  const related=BANK.filter(x=>x.theme===item.theme&&x.id!==item.id).slice(0,4);
  showSheet(`<div class="sheet-kicker">${t.icon} ${esc(t.name)}</div><h2 id="sheetTitle">${esc(item.title)}</h2><p>Turn this into a little intellectual trail. Watermelons can move from the idea to related concepts, a question, a connection, and a deeper source.</p><div class="trail"><span>${esc(item.title)}</span><b>→</b><span>Related idea</span><b>→</b><span>Question</span><b>→</b><span>Deeper dive</span></div><button class="cta" id="rabbitBtn">Grow this rabbit hole</button><h3>Nearby ideas</h3><div class="mini-list">${related.map(x=>`<button data-open="${x.id}"><span>${topic(x.theme).icon}</span><div><strong>${esc(x.title)}</strong><small>${esc(x.tag)}</small></div><b>›</b></button>`).join('')}</div>`);
  document.getElementById('rabbitBtn').onclick=()=>{const fresh=generateLocal(8,item.title);showSheet(`<div class="sheet-kicker">🌱 Rabbit hole grown</div><h2 id="sheetTitle">${esc(item.title)}</h2><p>Eight new stepping stones were added to your private learning pool.</p><div class="paper"><p><b>Next up</b></p>${fresh.slice(0,4).map(x=>`<p>• ${esc(x.title)}</p>`).join('')}</div><button class="cta" id="wanderBtn">Wander there →</button>`);document.getElementById('wanderBtn').onclick=()=>{closeSheet();renderFeed(fresh);}};
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{const x=[...BANK,...state.generated].find(y=>y.id===b.dataset.open);if(x)openExplore(x)});
}
async function shareItem(item){
  const text=`${item.title}\n\n${item.dek||item.body||''}\n\nFrom Watermelons 🍉`;
  if(navigator.share){try{await navigator.share({title:item.title,text});return}catch{}}
  try{await navigator.clipboard.writeText(text);toast('Copied to clipboard');}catch{toast('Sharing is not available here yet.')}}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}

function showSheet(html){document.getElementById('sheetContent').innerHTML=html;document.getElementById('sheet').classList.remove('hidden');document.getElementById('sheet').setAttribute('aria-hidden','false')}
function closeSheet(){document.getElementById('sheet').classList.add('hidden');document.getElementById('sheet').setAttribute('aria-hidden','true')}
document.getElementById('closeSheet').onclick=closeSheet;document.querySelector('.sheet-backdrop').onclick=closeSheet;

document.getElementById('settingsBtn').onclick=()=>settingsSheet();
function settingsSheet(){
 showSheet(`<div class="sheet-kicker">⚙︎ Personal garden</div><h2 id="sheetTitle">Tune your Watermelons</h2><p>Your choices stay on this device. The feed uses them to decide what to surface next.</p><h3>Interests</h3><div class="topic-grid">${TOPICS.map(t=>`<button class="topic ${state.prefs.topics.includes(t.id)?'selected':''}" data-pref-topic="${t.id}"><span>${t.icon}</span><strong>${t.name}</strong><small>${t.desc}</small></button>`).join('')}</div><h3>Difficulty</h3><div class="segmented">${['gentle','curious','deep'].map(x=>`<button class="${state.prefs.difficulty===x?'selected':''}" data-diff="${x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div><h3>Novelty</h3><label class="range-label"><span>Familiar</span><input id="novelty" type="range" min="0" max="100" value="${state.prefs.novelty}"><span>Surprise me</span></label><button class="cta" id="surpriseBtn">🍉 Give me something unexpected</button><button class="danger-btn" id="resetBtn">Reset my local Watermelons data</button>`);
 document.querySelectorAll('[data-pref-topic]').forEach(b=>b.onclick=()=>{const id=b.dataset.prefTopic;if(state.prefs.topics.includes(id)){if(state.prefs.topics.length>1)state.prefs.topics=state.prefs.topics.filter(x=>x!==id)}else state.prefs.topics.push(id);save('watermelons-prefs',state.prefs);settingsSheet();});
 document.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{state.prefs.difficulty=b.dataset.diff;save('watermelons-prefs',state.prefs);settingsSheet();});

 document.getElementById('surpriseBtn').onclick=()=>{state.prefs.shuffle=true;state.prefs.novelty=100;save('watermelons-prefs',state.prefs);closeSheet();renderFeed(nextBatch(10));toast('A fresh path is waiting');};
 document.getElementById('resetBtn').onclick=()=>{if(confirm('Reset saved items, progress, and preferences on this device?')){localStorage.clear();location.reload();}};
}

document.querySelectorAll('.nav-btn').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');state.tab=btn.dataset.tab;renderTab()});
function renderTab(){
 if(state.tab==='feed'){renderFeed(nextBatch(8));return}
 if(state.tab==='saved'){const items=uniqueItems([...BANK,...state.generated]).filter(x=>state.saved.includes(x.id));renderFeed(items.length?items:[{id:'empty',theme:'literature',tag:'Saved Garden',title:'Your saved ideas will live here',dek:'When something makes you stop scrolling, save it.',body:'Try the ☆ Save button on any card. Your collection stays on this device.',type:'text'}]);return}
 if(state.tab==='explore'){showExplore();return}
 if(state.tab==='ai'){showAIPage();return}

}
function showExplore(){
 showSheet(`<div class="sheet-kicker">✦ Wander</div><h2 id="sheetTitle">Choose a world</h2><p>Pick a subject, then let curiosity decide where you go next.</p><div class="topic-grid">${TOPICS.map(t=>`<button class="topic" data-explore-topic="${t.id}"><span>${t.icon}</span><strong>${t.name}</strong><small>${t.desc}</small></button>`).join('')}</div><div class="request-box"><h3>Ask for something specific</h3><p class="small">Try “Stoicism and anger”, “obscure Greek myths”, or “how muscle protein synthesis works”.</p><div class="request"><input id="topicInput" placeholder="What do you want to learn?"><button id="requestBtn">Grow</button></div></div>`);
 document.querySelectorAll('[data-explore-topic]').forEach(b=>b.onclick=()=>{const id=b.dataset.exploreTopic;closeSheet();state.prefs.topics=[id,...state.prefs.topics.filter(x=>x!==id)];save('watermelons-prefs',state.prefs);renderFeed(nextBatch(10));});
 document.getElementById('requestBtn').onclick=()=>{const q=document.getElementById('topicInput').value.trim();if(!q)return;const fresh=generateLocal(10,q);closeSheet();renderFeed(fresh);toast('Your requested trail is growing');};
}
function showJourney(){
 const pct=state.attempted?Math.round(state.correct/state.attempted*100):0;
 showSheet(`<div class="sheet-kicker">◌ Your Journey</div><h2 id="sheetTitle">A garden of ideas</h2><div class="stats"><div class="stat"><b>${state.seen}</b><span>cards seen</span></div><div class="stat"><b>${state.saved.length}</b><span>saved</span></div><div class="stat"><b>${pct}%</b><span>quiz accuracy</span></div></div><div class="paper journey-paper"><p><b>Current streak</b></p><p class="big-number">${state.streak.count} day${state.streak.count===1?'':'s'}</p><p>Open Watermelons on different days and your garden keeps growing.</p></div><div class="paper"><p><b>Your active shelves</b></p>${selectedTopics().map(id=>`<span class="shelf-chip">${topic(id).icon} ${topic(id).name}</span>`).join('')}</div><button class="cta" id="journeyWander">Keep wandering →</button>`);
 document.getElementById('journeyWander').onclick=()=>{closeSheet();state.tab='feed';document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab==='feed'));renderFeed(nextBatch(8));};
}

function observeCards(){
 if(!('IntersectionObserver' in window))return;
 const obs=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>.65){markSeen(e.target);}}),{threshold:.65});
 document.querySelectorAll('.card:not([data-observed])').forEach(c=>{c.dataset.observed='1';obs.observe(c)});
}
function markSeen(card){if(card.dataset.seen)return;card.dataset.seen='1';state.seen++;save('watermelons-seen',state.seen);updateStreak();}
function updateStreak(){
 const today=new Date().toISOString().slice(0,10);const last=state.streak.last;
 if(last===today)return;
 const yesterday=new Date(Date.now()-86400000).toISOString().slice(0,10);
 state.streak.count=last===yesterday?state.streak.count+1:1;state.streak.last=today;save('watermelons-streak',state.streak);
}
feed.addEventListener('scroll',()=>{if(state.tab==='feed'&&feed.scrollTop+feed.clientHeight>=feed.scrollHeight-700){const items=nextBatch(6);items.forEach(x=>feed.appendChild(card(x)));observeCards();}});

 showSheet(`<div class="welcome"><div class="melon">🍉</div><div class="sheet-kicker">WELCOME TO WATERMELONS</div><h2 id="sheetTitle">Scroll somewhere worth going.</h2><p>A private learning feed built to replace the empty calories of endless scrolling with psychology, philosophy, mythology, faith, fitness, history, science, literature, and whatever your curiosity asks for next.</p><div class="welcome-points"><span>🌿 Beautiful, topic-specific worlds</span><span>🧠 Bite-sized learning + quizzes</span><span>🕳️ Rabbit holes when curiosity strikes</span><span>💾 Save what you want to keep</span></div><button class="cta" id="startBtn">Plant the garden →</button></div>`);
 document.getElementById('startBtn').onclick=()=>{state.onboarding=true;localStorage.setItem('watermelons-onboarded','1');closeSheet();renderFeed(nextBatch(8));};
}

const wmXPKey='watermelons-xp', wmThemeKey='watermelons-theme', wmQuestKey='watermelons-quest';
let wmXP=Number(localStorage.getItem(wmXPKey)||0);

function wmToday(){return new Date().toISOString().slice(0,10)}
function wmRefreshQuest(){
  const today=wmToday();
  if(wmQuest.day!==today) wmQuest={day:today,seen:0,quiz:0,saved:0};
  const done=Math.min(wmQuest.seen,3);
  document.getElementById('questText').textContent=done>=3?'Quest complete! Pick a rabbit hole.':`Discover ${Math.max(0,3-done)} more new idea${3-done===1?'':'s'}`;
  document.getElementById('questIcon').textContent=done>=3?'🏆':'🧭';
  document.getElementById('questTitle').textContent=done>=3?'Daily Quest Complete':'Daily Quest';
  document.getElementById('xpPill').textContent=wmXP+' XP';
  save(wmQuestKey,wmQuest);
}
function wmAddXP(n,label){
  wmXP+=n; localStorage.setItem(wmXPKey,String(wmXP)); wmRefreshQuest();
  const f=document.createElement('div');f.className='xp-float';f.textContent=`+${n} XP ${label?'· '+label:''}`;document.body.appendChild(f);setTimeout(()=>f.remove(),950);
}
function wmApplyTheme(k){
  Object.values(WM_THEMES).forEach(t=>t.cls&&document.body.classList.remove(t.cls));
  const t=WM_THEMES[k]||WM_THEMES.meadow;
  if(t.cls)document.body.classList.add(t.cls);
  wmTheme=k;localStorage.setItem(wmThemeKey,k);
}

  document.querySelectorAll('[data-wm-theme]').forEach(b=>b.onclick=()=>{wmApplyTheme(b.dataset.wmTheme);closeSheet();toast(WM_THEMES[b.dataset.wmTheme].icon+' '+WM_THEMES[b.dataset.wmTheme].name+' activated');});
}
document.getElementById('themeBtn').onclick=wmThemeSheet;
wmApplyTheme(wmTheme);
wmRefreshQuest();

/* Reward normal actions so the learning loop has a little game underneath it. */
const wmOriginalToggleSave=toggleSave;
toggleSave=function(id,el){
  const before=state.saved.includes(id);
  wmOriginalToggleSave(id,el);
  if(!before){wmQuest.saved++;wmAddXP(5,'saved');}
  save(wmQuestKey,wmQuest);wmRefreshQuest();
};
const wmOriginalAnswerQuiz=answerQuiz;
answerQuiz=function(item,el,choice){
  const before=state.attempted;
  wmOriginalAnswerQuiz(item,el,choice);
  if(state.attempted>before){
    const ok=choice===item.answer;
    wmQuest.quiz++;
    wmAddXP(ok?15:3,ok?'nailed it':'good try');
    save(wmQuestKey,wmQuest);wmRefreshQuest();
  }
};
const wmOriginalMarkSeen=markSeen;
markSeen=function(card){
  const before=state.seen;
  wmOriginalMarkSeen(card);
  if(state.seen>before){
    wmQuest.seen++;
    wmAddXP(2,'discovered');
    save(wmQuestKey,wmQuest);wmRefreshQuest();
  }
};

/* PROCEDURAL LO-FI SOUNDSCAPE 3.0
   Local synth soundtrack. It starts only after a user tap and stays entirely in-browser. */
let wmAudio=null,wmMaster=null,wmPlaying=false,wmLoop=null,wmStep=0;
const WM_MUSIC={
 meadow:{bpm:76,root:196,scale:[0,2,4,7,9],chords:[[0,4,7],[2,5,9],[4,7,11],[0,3,7]],wave:'triangle'},
 ancient:{bpm:68,root:174,scale:[0,2,3,7,9],chords:[[0,3,7],[2,5,9],[3,7,10],[0,4,7]],wave:'sine'},
 pirate:{bpm:82,root:146,scale:[0,2,3,5,7,10],chords:[[0,3,7],[5,8,10],[3,7,10],[0,5,7]],wave:'triangle'},
 night:{bpm:64,root:110,scale:[0,3,5,7,10],chords:[[0,3,7],[5,8,10],[3,7,10],[0,5,7]],wave:'sine'},
 sunrise:{bpm:78,root:220,scale:[0,2,4,5,7,9,11],chords:[[0,4,7],[2,5,9],[4,7,11],[0,4,9]],wave:'triangle'}
};
function wmTone(freq,dur,when,type='sine',vol=.035,attack=.025){
  if(!wmAudio||!wmMaster)return;
  const o=wmAudio.createOscillator(),g=wmAudio.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,when);
  g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(vol,when+attack);g.gain.exponentialRampToValueAtTime(.0001,when+dur);
  o.connect(g);g.connect(wmMaster);o.start(when);o.stop(when+dur+.04);
}
function wmKick(when){wmTone(74,.08,when,'sine',.055,.004);wmTone(43,.16,when+.012,'sine',.035,.004)}
function wmHat(when){wmTone(4200,.035,when,'square',.009,.003)}
function wmMusicBar(){
  if(!wmAudio||!wmPlaying)return;
  const m=WM_MUSIC[wmTheme]||WM_MUSIC.meadow, beat=60/m.bpm, now=wmAudio.currentTime+.05, chord=m.chords[wmStep%m.chords.length];
  chord.forEach((n,i)=>wmTone(m.root*Math.pow(2,n/12),beat*3.7,now+i*.018,m.wave,.028,.09));
  wmTone(m.root/2,beat*3.6,now,'sine',.045,.07);
  for(let i=0;i<4;i++){
    if(i===0||i===2)wmKick(now+i*beat);
    if(i>0)wmHat(now+i*beat);
  }
  const melody=m.scale[(wmStep*2)%m.scale.length];
  wmTone(m.root*2*Math.pow(2,melody/12),beat*.55,now+beat*.55,'sine',.015,.04);
  if(wmStep%2===1)wmTone(m.root*2*Math.pow(2,m.scale[(wmStep+3)%m.scale.length]/12),beat*.4,now+beat*2.45,'sine',.012,.03);
  wmStep++;
  wmLoop=setTimeout(wmMusicBar,beat*4000);
}
async function wmStartSound(){
  if(wmPlaying)return;
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx)throw new Error('No Web Audio');
    wmAudio=new Ctx();
    await wmAudio.resume();
    wmMaster=wmAudio.createGain();
    wmMaster.gain.setValueAtTime(.0001,wmAudio.currentTime);
    wmMaster.gain.linearRampToValueAtTime(.72,wmAudio.currentTime+.45);
    wmMaster.connect(wmAudio.destination);
    // Immediate audible confirmation, then the loop takes over.
    const now=wmAudio.currentTime+.03;
    wmTone(392,.18,now,'triangle',.09,.015);wmTone(494,.28,now+.12,'sine',.07,.02);
    wmPlaying=true;wmStep=Math.floor(Math.random()*4);
    const btn=document.getElementById('soundBtn');btn.classList.add('sound-active','sound-on');btn.querySelector('.tool-icon').textContent='♫';
    wmMusicBar();
  }catch(e){
    wmPlaying=false;wmAudio=null;wmMaster=null;
    toast('Sound could not start. Make sure your phone is not muted, then tap SOUND again.');
  }
}
function wmStopSound(){
  if(!wmAudio)return;wmPlaying=false;clearTimeout(wmLoop);wmLoop=null;
  try{wmMaster?.gain.exponentialRampToValueAtTime(.0001,wmAudio.currentTime+.18);setTimeout(()=>{try{wmAudio?.close()}catch{}},260)}catch{}
  wmAudio=null;wmMaster=null;
  const btn=document.getElementById('soundBtn');btn.classList.remove('sound-active','sound-on');btn.querySelector('.tool-icon').textContent='🔊';
}
document.getElementById('soundBtn').onclick=async()=>{if(wmPlaying)wmStopSound();else await wmStartSound();};
document.addEventListener('visibilitychange',async()=>{if(!document.hidden&&wmPlaying&&wmAudio?.state==='suspended'){try{await wmAudio.resume();}catch{}}});
const wmOldApplyTheme=wmApplyTheme;wmApplyTheme=function(k){wmOldApplyTheme(k);if(wmPlaying){wmStopSound();setTimeout(()=>wmStartSound(),180)}};

async function askScotts(question){
  if(!question || aiBusy)return;
  const box=document.getElementById('aiChat');
  const input=document.getElementById('aiPageInput');
  aiBusy=true;
  aiChat.push({role:'user',text:question});
  renderAIChat();
  if(input)input.value='';
  if(box){
    box.insertAdjacentHTML('beforeend',`<div class="ai-thinking" id="aiThinking"><i></i><i></i><i></i><span>ScottsTot is thinking…</span></div>`);
    box.scrollTop=box.scrollHeight;
  }
  try{
    const recent=aiChat.slice(-8).map(m=>(m.role==='user'?'User: ':'ScottsTot: ')+m.text).join('\n');
    const prompt=`You are ScottsTot, the friendly AI learning companion inside an app called Watermelons.
The user is asking you questions to learn, explore ideas, and generate educational content.
Be accurate, curious, conversational, and concise. If the user asks for a quiz, ask only the next question and wait for their answer.
If the user asks for an explanation, teach rather than merely define. Avoid pretending to have personal experiences.
Conversation so far:
${recent}
Respond to the user's latest message.`;
    const response=await fetch(SCOTTS_TOT_URL+'/generate',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt})
    });
    const data=await response.json();
    if(!response.ok || !data.ok || !data.text)throw new Error('AI request failed');
    aiChat.push({role:'bot',text:data.text.trim()});
    // Keep a compact local memory of the conversation.
    state.aiChat=aiChat.slice(-20);
    save('watermelons-ai-chat',state.aiChat);
  }catch(err){
    aiChat.push({role:'bot',text:'I hit a little snag reaching ScottsTot. Try that question again in a moment.'});
  }finally{
    aiBusy=false;
    renderAIChat();
  }
}

/* SCOTTSTOT AI BRIDGE */
const SCOTTS_TOT_URL = 'https://scottstot.scootyblocks.workers.dev';
let aiBusy = false;

function aiTopicForRequest(request=''){
  const q = request.toLowerCase();
  const hit = TOPICS.find(t => q.includes(t.name.toLowerCase()) || q.includes(t.id));
  return hit ? hit.id : (selectedTopics()[0] || 'psychology');
}

function aiCardFromText(text, request=''){
  const clean = String(text || '').replace(/\s+/g,' ').trim();
  if(!clean) return null;
  const theme = aiTopicForRequest(request);
  const t = topic(theme);
  let title = clean.split(/[.!?]/)[0].trim();
  if(title.length < 8 || title.length > 70) title = request ? request.slice(0,58) : 'A fresh idea from ScottsTot';
  if(title.length > 70) title = title.slice(0,67) + '…';
  const dek = request ? `ScottsTot wandered into ${t.name.toLowerCase()} because you asked.` : `A fresh idea, generated just for your Watermelons garden.`;
  return {
    id:'ai-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),
    theme, type:'concept', tag:`${t.name} · ScottsTot`,
    title, dek, body:clean
  };
}

async function fetchAI(request=''){
  const prompt = request
    ? `Create one fascinating learning card about: ${request}. Prefer an accurate, surprising concept. Explain it conversationally in about 90 to 130 words. Do not use markdown headings.`
    : `Create one fascinating learning card for a curious university student. Focus on ${topic(selectedTopics()[Math.floor(Math.random()*selectedTopics().length)]).name}. Prefer an accurate, surprising concept. Explain it conversationally in about 90 to 130 words. Do not use markdown headings.`;
  const response = await fetch(SCOTTS_TOT_URL + '/generate', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({prompt,request,topics:selectedTopics(),difficulty:state.prefs.difficulty,novelty:state.prefs.novelty})
  });
  if(!response.ok) throw new Error('ScottsTot returned '+response.status);
  const data = await response.json();
  if(!data.ok || !data.text) throw new Error('No AI text returned');
  return aiCardFromText(data.text, request);
}

async function addAICard(request='', prepend=false){
  if(aiBusy)return;
  aiBusy=true;
  try{
    const item = await fetchAI(request);
    if(!item) throw new Error('Empty AI card');
    state.generated=[...state.generated,item].slice(-120);
    save('watermelons-generated',state.generated);
    if(prepend){
      feed.prepend(card(item));
      feed.scrollTo({top:0,behavior:'smooth'});
    }else{
      feed.appendChild(card(item));
      observeCards();
    }
    toast('🧠 ScottsTot grew a new idea');
    return item;
  }catch(e){
    toast('ScottsTot is taking a breath. Your local garden is still growing.');
    return null;
  }finally{
    aiBusy=false;
  }
}
