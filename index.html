<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#738965">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Watermelons">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<title>Watermelons</title>

<style>
:root{
  --ink:#263329;
  --muted:#697568;
  --paper:#f8f2e2;
  --cream:#fffaf0;
  --sage:#738965;
  --sage-dark:#43553e;
  --line:rgba(54,70,53,.15);
  --shadow:0 18px 45px rgba(31,45,31,.22);
  --cyan:#79e8ff;
  --violet:#b69cff;
  --gold:#ffd77a;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  height:100%;
  font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#071116;
  color:var(--ink);
}

body{
  overflow:hidden;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app-shell{
  height:100dvh;
  max-width:560px;
  margin:auto;
  position:relative;
  background:
    radial-gradient(circle at 50% -10%,rgba(102,220,214,.12),transparent 32%),
    #0a151b;
  overflow:hidden;
}

/* =========================
   TOP BAR
   ========================= */

.topbar{
  height:88px;
  padding:11px 12px 9px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(8,18,23,.72);
  backdrop-filter:blur(14px);
  position:relative;
  z-index:5;
  border-bottom:1px solid rgba(121,232,255,.14);
  box-shadow:0 8px 35px rgba(0,0,0,.18);
}

.eyebrow{
  font-size:9px;
  letter-spacing:.16em;
  font-weight:800;
  color:#79d9d0;
}

h1{
  font:700 25px Georgia,serif;
  margin:2px 0 0;
  color:#f2fbf8;
}

.top-actions{
  display:flex;
  gap:7px;
}

.icon-btn{
  border:1px solid rgba(121,232,255,.12);
  background:rgba(121,232,255,.07);
  width:40px;
  height:40px;
  border-radius:50%;
  font-size:19px;
  color:#d9f8f5;
  box-shadow:inset 0 0 18px rgba(121,232,255,.04);
}

/* =========================
   QUEST STRIP
   ========================= */

.quest-strip{
  height:50px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:7px 14px;
  background:rgba(7,17,22,.68);
  border-bottom:1px solid rgba(121,232,255,.11);
  backdrop-filter:blur(12px);
  position:relative;
  z-index:4;
  color:#edfdfa;
}

.quest-copy{
  display:flex;
  align-items:center;
  gap:8px;
}

.quest-copy b{
  font-size:11px;
}

.quest-copy small{
  color:#8fa9a8;
  font-size:10px;
}

.xp-pill{
  background:rgba(121,232,255,.08);
  border:1px solid rgba(121,232,255,.18);
  color:#bff7f0;
  border-radius:999px;
  padding:7px 10px;
  font-size:10px;
  font-weight:900;
}

/* =========================
   FEED
   ========================= */

.feed{
  height:calc(100dvh - 88px - 50px - 76px);
  overflow-y:auto;
  scroll-snap-type:y mandatory;
  scrollbar-width:none;
  background:#071116;
}

.feed::-webkit-scrollbar{
  display:none;
}

.card{
  min-height:100%;
  scroll-snap-align:start;
  position:relative;
  padding:26px 20px 28px;
  display:flex;
  align-items:flex-end;
  background:#071116;
  isolation:isolate;
  overflow:hidden;
}

.card:before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-2;
  background:var(--bg);
  background-size:cover;
  background-position:center;
  filter:saturate(1.12) contrast(1.05);
  transform:scale(1.02);
  animation:wmBreathe 14s ease-in-out infinite alternate;
}

.card:after{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  background:
    linear-gradient(
      180deg,
      rgba(4,10,13,.02),
      rgba(4,10,13,.08) 28%,
      rgba(3,9,12,.9) 100%
    );
}

.card[data-theme="psychology"]{
  --bg:
    radial-gradient(
      circle at 22% 20%,
      #d6e6e8 0,
      #92b3b5 25%,
      #516d68 55%,
      #243a35 100%
    );
}

.card[data-theme="philosophy"]{
  --bg:
    linear-gradient(
      135deg,
      #c6aa7c,
      #e1cfaa 43%,
      #718269 70%,
      #3b4e3c
    );
}

.card[data-theme="mythology"]{
  --bg:
    linear-gradient(
      135deg,
      #d6a26b,
      #8c6c4a 43%,
      #536d52 68%,
      #263d30
    );
}

.card[data-theme="faith"]{
  --bg:
    linear-gradient(
      135deg,
      #f0d28b,
      #ad9d69 36%,
      #67825f 66%,
      #304a37
    );
}

.card[data-theme="fitness"]{
  --bg:
    linear-gradient(
      135deg,
      #b7a580,
      #71856b 44%,
      #3f5845 68%,
      #1e3229
    );
}

.card[data-theme="history"]{
  --bg:
    linear-gradient(
      135deg,
      #e0c08d,
      #a08460 42%,
      #66654c 68%,
      #333e32
    );
}

.card[data-theme="science"]{
  --bg:
    radial-gradient(
      circle at 75% 18%,
      #c7d8ee 0,
      #8193b3 25%,
      #4b5d78 55%,
      #202d40 100%
    );
}

.card[data-theme="literature"]{
  --bg:
    linear-gradient(
      135deg,
      #b9a58a,
      #7d765e 45%,
      #4d5d4d 70%,
      #27372e
    );
}

.content{
  width:100%;
  max-width:480px;
  margin:auto auto 0;
  position:relative;
}

.content:before{
  content:"";
  position:absolute;
  left:-16px;
  right:-16px;
  bottom:-20px;
  height:190px;
  background:
    radial-gradient(
      ellipse at 50% 100%,
      rgba(121,232,255,.09),
      transparent 65%
    );
  pointer-events:none;
  z-index:-1;
}

.card-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.pill{
  display:inline-flex;
  padding:7px 10px;
  border-radius:999px;
  background:rgba(6,16,20,.55);
  color:#fff;
  font-size:11px;
  font-weight:700;
  backdrop-filter:blur(8px);
  border:1px solid rgba(121,232,255,.18);
  box-shadow:0 0 20px rgba(121,232,255,.05);
}

.topic-dot{
  font-size:20px;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.25));
}

.card h2{
  font:700 clamp(29px,7vw,43px)/1.02 Georgia,serif;
  color:white;
  margin:12px 0 10px;
  letter-spacing:-.02em;
  text-shadow:0 3px 22px rgba(0,0,0,.4);
}

.card .dek{
  font-size:15px;
  line-height:1.45;
  color:#f8f7ed;
  max-width:440px;
  margin:0 0 15px;
}

.paper{
  background:rgba(246,250,241,.94);
  border:1px solid rgba(255,255,255,.5);
  border-radius:22px;
  padding:16px 17px;
  color:var(--ink);
  box-shadow:
    0 16px 50px rgba(0,0,0,.26),
    0 0 30px rgba(121,232,255,.05);
  margin:13px 0;
}

.paper p{
  margin:0 0 9px;
  line-height:1.45;
  font-size:14px;
}

.paper p:last-child{
  margin-bottom:0;
}

.quote{
  font:italic 19px/1.35 Georgia,serif;
}

.byline{
  font-size:12px!important;
  color:var(--muted);
  font-weight:700;
}

.actions,
.sub-actions{
  display:flex;
  gap:8px;
  align-items:center;
  margin-top:10px;
}

.actions button,
.sub-actions button,
.cta{
  border:1px solid rgba(121,232,255,.16);
  background:rgba(5,15,19,.62);
  color:#fff;
  border-radius:999px;
  padding:10px 12px;
  font-weight:700;
  cursor:pointer;
  backdrop-filter:blur(8px);
  font-size:12px;
  box-shadow:0 0 18px rgba(121,232,255,.04);
}

.actions button.saved{
  background:#f4efd9;
  color:var(--ink);
}

.actions .grow,
.sub-actions .grow{
  flex:1;
}

.sub-actions{
  margin-top:7px;
}

.sub-actions button{
  background:transparent;
  border-color:rgba(255,255,255,.15);
  font-size:11px;
}

/* =========================
   QUIZZES
   ========================= */

.quiz-options{
  display:grid;
  gap:8px;
}

.quiz-options button{
  padding:11px 12px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#f7f2e5;
  text-align:left;
  color:var(--ink);
  cursor:pointer;
}

.quiz-options button:disabled{
  opacity:1;
}

.quiz-options button.correct{
  outline:2px solid #728d61;
  background:#edf5e7;
}

.quiz-options button.wrong{
  outline:2px solid #a65c4d;
  background:#f8e9e4;
}

.quiz-result{
  font-size:12px!important;
  font-weight:700;
  margin-top:10px!important;
}

.quiz-result.good{
  color:#4e7444;
}

.quiz-result.bad{
  color:#9a5144;
}

/* =========================
   SHEETS
   ========================= */

.sheet{
  position:fixed;
  inset:0;
  z-index:50;
}

.sheet.hidden{
  display:none;
}

.sheet-backdrop{
  position:absolute;
  inset:0;
  background:rgba(22,29,22,.42);
  backdrop-filter:blur(4px);
}

.sheet-card{
  position:absolute;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:min(560px,100%);
  max-height:90dvh;
  overflow:auto;
  background:var(--cream);
  border-radius:28px 28px 0 0;
  padding:28px 22px 36px;
  box-shadow:0 -20px 60px rgba(0,0,0,.2);
}

.close-btn{
  position:absolute;
  right:18px;
  top:16px;
  border:0;
  background:rgba(67,85,62,.08);
  width:40px;
  height:40px;
  border-radius:50%;
  font-size:19px;
  color:var(--ink);
}

.sheet-card h2{
  font:700 30px Georgia,serif;
  margin:0 40px 10px 0;
}

.sheet-card h3{
  font:700 16px Georgia,serif;
  margin:22px 0 10px;
}

.sheet-card p{
  line-height:1.5;
  color:var(--muted);
}

.sheet-kicker{
  font-size:10px;
  letter-spacing:.13em;
  font-weight:900;
  color:var(--sage-dark);
  margin-bottom:7px;
}

/* =========================
   TOPIC / SETTINGS
   ========================= */

.topic-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin:14px 0;
}

.topic{
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
  background:#f3eedf;
  text-align:left;
  cursor:pointer;
  color:var(--ink);
}

.topic.selected{
  background:#dfe9d4;
  border-color:#738965;
  box-shadow:inset 0 0 0 1px #738965;
}

.topic strong{
  display:block;
  margin-top:6px;
}

.topic small{
  display:block;
  color:var(--muted);
  line-height:1.3;
  margin-top:4px;
}

.segmented{
  display:flex;
  gap:7px;
}

.segmented button{
  flex:1;
  border:1px solid var(--line);
  background:#f3eedf;
  padding:11px;
  border-radius:13px;
  font-weight:800;
  color:var(--ink);
}

.segmented button.selected{
  background:var(--sage-dark);
  color:#fff;
}

.range-label{
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--muted);
  font-size:11px;
}

.range-label input{
  flex:1;
  accent-color:var(--sage-dark);
}

.cta{
  display:block;
  width:100%;
  background:var(--sage-dark);
  padding:13px;
  margin-top:14px;
  font-size:14px;
}

.danger-btn{
  border:0;
  background:transparent;
  color:#9a5144;
  font-weight:800;
  padding:16px 0;
  cursor:pointer;
}

/* =========================
   REQUEST BOX
   ========================= */

.request-box{
  background:#f3eedf;
  border:1px solid var(--line);
  border-radius:20px;
  padding:16px;
  margin-top:18px;
}

.request-box h3{
  margin-top:0;
}

.request{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.request input{
  flex:1;
  border:1px solid var(--line);
  border-radius:14px;
  padding:13px;
  background:white;
  font:inherit;
  min-width:0;
}

.request button{
  border:0;
  border-radius:14px;
  padding:0 15px;
  background:var(--sage-dark);
  color:white;
  font-weight:800;
}

/* =========================
   JOURNEY
   ========================= */

.trail{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  align-items:center;
  margin:18px 0;
}

.trail span{
  background:#f1ead8;
  border:1px solid var(--line);
  padding:8px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}

.trail b{
  color:var(--muted);
}

.mini-list{
  display:grid;
  gap:7px;
}

.mini-list button{
  display:flex;
  align-items:center;
  gap:10px;
  border:1px solid var(--line);
  background:#f3eedf;
  border-radius:15px;
  padding:10px;
  text-align:left;
}

.mini-list button span{
  font-size:20px;
}

.mini-list button div{
  flex:1;
}

.mini-list strong,
.mini-list small{
  display:block;
}

.mini-list small{
  color:var(--muted);
  margin-top:2px;
}

.mini-list b{
  font-size:20px;
  color:var(--muted);
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.stat{
  background:#f0ebdc;
  border-radius:18px;
  padding:16px;
  text-align:center;
}

.stat b{
  display:block;
  font:700 25px Georgia,serif;
}

.stat span{
  font-size:11px;
  color:var(--muted);
}

.journey-paper{
  margin-top:14px;
}

.big-number{
  font:700 34px Georgia,serif!important;
  color:var(--ink)!important;
  margin:0!important;
}

.shelf-chip{
  display:inline-block;
  background:#f0ead9;
  border:1px solid var(--line);
  border-radius:999px;
  padding:7px 9px;
  margin:3px;
  font-size:11px;
  font-weight:700;
}

/* =========================
   WELCOME
   ========================= */

.welcome{
  text-align:center;
  padding-top:8px;
}

.melon{
  font-size:60px;
  margin-bottom:8px;
}

.welcome h2{
  margin-left:0!important;
}

.welcome-points{
  display:grid;
  gap:8px;
  text-align:left;
  margin:18px 0;
}

.welcome-points span{
  background:#f2ecdc;
  border-radius:14px;
  padding:11px;
  font-size:13px;
}

/* =========================
   MAP
   ========================= */

.map-view{
  height:100%;
  overflow:auto;
  padding:16px 12px 28px;
  background:
    radial-gradient(circle at 50% 20%,#122d35 0,#071116 52%,#04090c 100%);
  color:#dffaf6;
}

.map-view:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.14;
  background:
    repeating-linear-gradient(
      0deg,
      transparent 0,
      transparent 3px,
      rgba(121,232,255,.08) 4px
    );
  mix-blend-mode:screen;
}

.map-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
  padding:4px 4px 12px;
}

.map-head h2{
  font-family:ui-sans-serif,system-ui,sans-serif;
  font-size:27px;
  letter-spacing:-.04em;
  margin:0;
  color:#effffd;
}

.map-head p{
  font-size:11px;
  color:#789b9c;
  margin:3px 0 0;
}

.map-paper{
  position:relative;
  min-height:720px;
  border-radius:26px;
  overflow:hidden;
  border:1px solid rgba(121,232,255,.24);
  background:
    radial-gradient(circle at 50% 50%,rgba(41,106,116,.2),transparent 38%),
    linear-gradient(145deg,#0d222a,#08151b 52%,#0b1b20);
  box-shadow:
    inset 0 0 70px rgba(121,232,255,.06),
    0 20px 70px rgba(0,0,0,.42);
}

.map-paper:before{
  content:"";
  position:absolute;
  inset:0;
  opacity:.16;
  background-image:
    linear-gradient(rgba(121,232,255,.13) 1px,transparent 1px),
    linear-gradient(90deg,rgba(121,232,255,.13) 1px,transparent 1px);
  background-size:34px 34px;
  pointer-events:none;
}

.map-paper:after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:35%;
  background:linear-gradient(
    transparent,
    rgba(121,232,255,.07),
    transparent
  );
  animation:wmScan 7s linear infinite;
  pointer-events:none;
}

.map-title{
  position:absolute;
  top:17px;
  left:50%;
  transform:translateX(-50%);
  color:#d9fffa;
  font-family:ui-sans-serif,system-ui,sans-serif;
  font-size:12px;
  letter-spacing:.28em;
  text-shadow:0 0 18px rgba(121,232,255,.7);
  white-space:nowrap;
}

.compass{
  position:absolute;
  right:18px;
  top:18px;
  font-size:40px;
  color:#79e8ff;
  opacity:.8;
  text-shadow:0 0 18px rgba(121,232,255,.7);
}

.route{
  position:absolute;
  border-top:1px dashed rgba(121,232,255,.5);
  box-shadow:0 0 8px rgba(121,232,255,.22);
  width:34%;
  transform-origin:left center;
  pointer-events:none;
  animation:wmRoute 3.5s ease-in-out infinite alternate;
}

.route.r1{
  left:16%;
  top:38%;
  width:48%;
  transform:rotate(-8deg);
}

.route.r2{
  left:45%;
  top:53%;
  width:40%;
  transform:rotate(17deg);
  animation-delay:1s;
}

.route.r3{
  left:25%;
  top:70%;
  width:52%;
  transform:rotate(9deg);
  animation-delay:2s;
}

.island{
  position:absolute;
  border:1px solid rgba(121,232,255,.22);
  background:
    radial-gradient(
      circle at 35% 35%,
      rgba(121,232,255,.18),
      rgba(41,89,91,.1) 45%,
      transparent 70%
    );
  border-radius:53% 47% 60% 40%/44% 57% 43% 56%;
  box-shadow:
    inset 0 0 35px rgba(121,232,255,.08),
    0 0 20px rgba(121,232,255,.04);
}

.island.i1{
  width:210px;
  height:115px;
  left:6%;
  top:25%;
}

.island.i2{
  width:165px;
  height:105px;
  right:5%;
  top:38%;
  transform:rotate(12deg);
}

.island.i3{
  width:190px;
  height:120px;
  left:30%;
  bottom:7%;
  transform:rotate(3deg);
}

.island.i4{
  width:120px;
  height:78px;
  right:18%;
  top:18%;
  transform:rotate(-18deg);
}

.world-pin{
  position:absolute;
  z-index:2;
  border:1px solid rgba(121,232,255,.2);
  border-radius:18px;
  padding:9px 11px;
  text-align:left;
  min-width:126px;
  background:rgba(8,24,30,.76);
  color:#e8fffb;
  box-shadow:
    0 8px 25px rgba(0,0,0,.28),
    inset 0 0 18px rgba(121,232,255,.035);
  backdrop-filter:blur(10px);
  transition:.2s ease;
}

.world-pin:before{
  content:"";
  position:absolute;
  inset:5px;
  border:1px solid rgba(121,232,255,.06);
  border-radius:13px;
  pointer-events:none;
}

.world-pin b{
  display:block;
  font-family:ui-sans-serif,system-ui,sans-serif;
  color:#eaffff;
}

.world-pin small{
  display:block;
  margin-top:3px;
  font-size:9px;
  color:#7fa7a7;
}

.world-pin span{
  font-size:20px;
  float:left;
  margin-right:6px;
  text-shadow:0 0 12px rgba(121,232,255,.7);
}

.world-pin:hover{
  transform:translateY(-3px) scale(1.025);
  border-color:rgba(121,232,255,.55);
  box-shadow:0 0 25px rgba(121,232,255,.16);
}

.pin-psych{
  left:5%;
  top:25%;
}

.pin-phil{
  left:36%;
  top:38%;
}

.pin-myth{
  right:4%;

function loadState(){

  try{

    const raw=localStorage.getItem("watermelons-state");

    if(!raw){
      return structuredClone(DEFAULT_STATE);
    }

    const saved=JSON.parse(raw);

    return {
      ...structuredClone(DEFAULT_STATE),
      ...saved,
      prefs:{
        ...structuredClone(DEFAULT_STATE.prefs),
        ...(saved.prefs||{})
      }
    };

  }catch(err){

    console.warn("Could not load Watermelons state:",err);

    return structuredClone(DEFAULT_STATE);

  }

}

let state=loadState();

function saveState(){

  try{
    localStorage.setItem(
      "watermelons-state",
      JSON.stringify(state)
    );
  }catch(err){

}

function esc(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function toast(message){

  const el=document.getElementById("toast");

  if(!el)return;

  el.textContent=message;
  el.classList.remove("hidden");

  clearTimeout(window.__wmToast);

  window.__wmToast=setTimeout(()=>{
    el.classList.add("hidden");
  },2200);

}

function addXP(amount){

function activeCards(){

  const allowed=new Set(state.prefs.topics);

  let cards=[
    ...BANK,
    ...(state.generated||[])
  ].filter(card=>allowed.has(card.topic));

  if(!cards.length){
    cards=[...BANK];
  }

  return cards;

}

function shuffle(array){

  const copy=[...array];

  for(let i=copy.length-1;i>0;i--){

    const j=Math.floor(Math.random()*(i+1));

    [copy[i],copy[j]]=[copy[j],copy[i]];

  }

  return copy;

}

   ========================================================= */

function renderFeed(){

  const feed=document.getElementById("feed");

  if(!feed)return;

  feed.className="feed";

  const cards=shuffle(activeCards());

  feed.innerHTML=cards
    .slice(0,12)
    .map(renderCard)
    .join("");

  bindFeedButtons();

  state.seen.push(
    ...cards
      .slice(0,6)
      .map(x=>x.id)
      .filter(id=>!state.seen.includes(id))
  );

  state.seen=state.seen.slice(-100);

  saveState();

}

/* =========================================================
   FEED BUTTONS
   ========================================================= */

function bindFeedButtons(){

  document.querySelectorAll(".save-card").forEach(btn=>{

    btn.onclick=()=>{

      const id=btn.dataset.id;

      if(state.saved.includes(id)){

        state.saved=state.saved.filter(x=>x!==id);

        btn.classList.remove("saved");
        btn.textContent="♡ Save";

        toast("Removed from your shelf.");

      }else{

        state.saved.push(id);

        btn.classList.add("saved");
        btn.textContent="♥ Saved";

        addXP(5);

        toast("Saved to your shelf.");

      }

      saveState();

    };

  });

  document.querySelectorAll(".more-card").forEach(btn=>{

    btn.onclick=()=>{

      const card=activeCards()
        .find(x=>x.id===btn.dataset.id);

      if(!card)return;

      state.prefs.topics=[card.topic];

      saveState();

      renderFeed();

      toast(`More ${TOPICS[card.topic].label}.`);

    };

  });

  document.querySelectorAll(".share-card").forEach(btn=>{

    btn.onclick=async()=>{

      const card=activeCards()
        .find(x=>x.id===btn.dataset.id);

      if(!card)return;

      const text=
        `${card.title}\n\n${card.body}\n\n🍉 Watermelons`;

      try{

        if(navigator.share){

          await navigator.share({
            title:card.title,
            text
          });

        }else if(navigator.clipboard){

          await navigator.clipboard.writeText(text);

          toast("Copied to clipboard.");

        }else{

          toast("Sharing isn't available here.");

        }

      }catch(err){

        if(err?.name!=="AbortError"){
          toast("Couldn't share that one.");
        }

      }

    };

  });

}

async function askScotts(question){

  if(!question || aiBusy){
    return;
  }

  const box=document.getElementById("aiChat");
  const input=document.getElementById("aiPageInput");
  const send=document.getElementById("aiPageSend");

  aiBusy=true;

  if(send){
    send.disabled=true;
    send.textContent="…";
  }

  aiChat.push({
    role:"user",
    text:question
  });

  renderAIChat();

  if(input){
    input.value="";
  }

  if(box){

    box.insertAdjacentHTML(
      "beforeend",
      `
        <div
          class="ai-thinking"
          id="aiThinking"
        >
          <i></i>
          <i></i>
          <i></i>
          <span>ScottsTot is thinking…</span>
        </div>
      `
    );

    const page=document.querySelector(".ai-page");

    if(page){
      page.scrollTop=page.scrollHeight;
    }
  }

  try{

    const recent=
      aiChat
        .slice(-8)
        .map(
          message=>
            (message.role==="user"
              ?"User: "
              :"ScottsTot: ")
            +message.text
        )
        .join("\n");

    const prompt=`

You are ScottsTot, the friendly AI learning companion
inside an app called Watermelons.

The user is asking questions to learn, explore ideas,
and generate educational content.

Be accurate, curious, conversational, and concise.

If the user asks for a quiz, ask only the next question
and wait for their answer.

If the user asks for an explanation, teach rather than
merely define.

Avoid pretending to have personal experiences.

Conversation so far:

${recent}

Respond to the user's latest message.

`;

    const controller=
      new AbortController();

    const timeout=
      setTimeout(
        ()=>controller.abort(),
        25000
      );

    let response;

    try{

      response=await fetch(
        SCOTTS_TOT_URL+
        "/generate?wm="+
        Date.now(),
        {
          method:"POST",
          headers:{
            "Content-Type":"application/json"
          },
          body:JSON.stringify({
            prompt
          }),
          cache:"no-store",
          signal:controller.signal
        }
      );

    }finally{

      clearTimeout(timeout);

    }

    let data=null;

    try{

      data=await response.json();

    }catch(err){

      throw new Error(
        "Worker returned invalid JSON."
      );

    }

    if(
      !response.ok ||
      !data ||
      !data.ok ||
      !data.text
    ){

      console.error(
        "ScottsTot Worker error:",
        data
      );

      throw new Error(
        "ScottsTot request failed."
      );

    }

    aiChat.push({
      role:"bot",
      text:String(data.text).trim()
    });

    state.aiChat=
      aiChat.slice(-20);

    saveState();

  }catch(err){

    console.error(
      "ScottsTot error:",
      err
    );

    let message=
      "I hit a little snag reaching ScottsTot.";

    if(err?.name==="AbortError"){

      message=
        "ScottsTot took too long to respond. Try that question again.";

    }

    aiChat.push({
      role:"bot",
      text:message
    });

  }finally{

    aiBusy=false;

    renderAIChat();

    const sendAgain=
      document.getElementById("aiPageSend");

    if(sendAgain){

      sendAgain.disabled=false;
      sendAgain.textContent="➤";

    }

  }

}

function openSettings(){

function renderSettings(){

  const grid=
    document.getElementById("topicGrid");

  if(grid){

    grid.innerHTML=
      Object.entries(TOPICS)
        .map(([key,t])=>`

          <button
            type="button"
            class="topic ${
              state.prefs.topics.includes(key)
                ?"selected"
                :""

            data-setting-topic="${key}"
          >

              ${t.icon}

            <strong>
              ${esc(t.label)}

            </small>

          </button>

        `)
        .join("");

    grid
      .querySelectorAll("[data-setting-topic]")
      .forEach(btn=>{

        btn.onclick=()=>{

          const topic=
            btn.dataset.settingTopic;

          if(state.prefs.topics.includes(topic)){

            if(state.prefs.topics.length>1){

              state.prefs.topics=
                state.prefs.topics.filter(
                  x=>x!==topic
                );

            }

          }else{

            state.prefs.topics.push(topic);

          }

          saveState();

          renderSettings();

        };

      });

  }

  document
    .querySelectorAll(
      "#difficultyButtons button"
    )
    .forEach(btn=>{

      btn.classList.toggle(
        "selected",
        btn.dataset.value===
        state.prefs.difficulty
      );

      btn.onclick=()=>{

        state.prefs.difficulty=
          btn.dataset.value;

        saveState();

        renderSettings();

      };

    });

      "noveltyRange"
    );

    range.value=
      state.prefs.novelty;

    range.oninput=()=>{

      state.prefs.novelty=
        Number(range.value);

      saveState();

    };

  }

}

}

function updateQuest(){

  const title=
    document.getElementById(
      "questTitle"
    );

  const text=
    document.getElementById(
      "questText"
    );

  const quests=[
    [
      "Daily Quest",
      "Discover something interesting."
    ],
    [
      "Rabbit Hole",
      "Explore a new topic."
    ],
    [
      "Curiosity Streak",
      "Save one idea worth remembering."
    ],
    [
      "Brain Snack",
      "Answer a quiz question."
    ]
  ];

  const quest=
    quests[
      new Date().getDate()%
      quests.length
    ];

  if(title){
    title.textContent=quest[0];
  }

  if(text){
    text.textContent=quest[1];
  }

}

  /*
